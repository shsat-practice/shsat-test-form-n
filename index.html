<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHSAT Practice — ELA &amp; Mathematics</title>
<style>
:root{
  --ink:#16202e; --ink-soft:#5a6579; --ink-faint:#8b94a5;
  --rule:#dde3ec; --canvas:#eef1f6; --card:#fff;
  --accent:#1f5aa8; --accent-soft:#e9f0fa; --accent-deep:#16416f;
  --amber:#8a6114; --amber-bg:#fdf3dd; --amber-line:#e7cf9a;
  --danger:#b42318; --ok:#15803d;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--ui);
     font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.wrap.wide{max-width:1400px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
.bar-in{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;
        align-items:center;justify-content:space-between;gap:14px}
.brand{font-size:14px;font-weight:600;letter-spacing:.02em}
.brand span{color:#93a3bb;font-weight:500}
.count{font-size:14px;color:#c2ccdb;font-variant-numeric:tabular-nums}
.track{height:3px;background:#0d1725}
.track i{display:block;height:100%;background:#5b9bd8;transition:width .25s ease}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;
      padding:32px 40px;margin:26px 0}
h1{font-size:28px;line-height:1.25;margin:0 0 14px}
h2{font-size:16px;font-weight:700;margin:24px 0 10px}
.lede{color:var(--ink-soft);margin:0 0 20px}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.qnum{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:var(--ink-faint)}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
       color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-line);
       padding:2px 8px;border-radius:4px}

/* ---------- split layout ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;
       align-items:start;margin:22px 0}
.pane{background:var(--card);border:1px solid var(--rule);border-radius:10px;
      display:flex;flex-direction:column;min-height:0}
.pane.passage{position:sticky;top:64px;max-height:calc(100vh - 92px)}
.pane.qs{padding:28px 32px}
.ptabs{display:flex;gap:3px;padding:7px 8px 0;border-bottom:1px solid var(--rule);
       flex-wrap:wrap;flex:none;background:#f7f9fc;border-radius:10px 10px 0 0}
.ptab{flex:none;border:1px solid transparent;border-bottom:none;background:none;
      padding:7px 10px;border-radius:7px 7px 0 0;font-size:12px;font-weight:600;
      color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.ptab:hover{background:#eef2f8;color:var(--ink)}
.ptab.on{background:#fff;border-color:var(--rule);color:var(--ink);
         box-shadow:0 1px 0 #fff;margin-bottom:-1px}
.ptab.done{color:var(--ink-faint);cursor:not-allowed;opacity:.65}
.ptab.done:hover{background:none;color:var(--ink-faint)}
.ptab .lk{font-size:11px;margin-right:4px}
.pbody{overflow-y:auto;padding:22px 30px 28px;font-family:var(--serif);
       font-size:16.5px;line-height:1.62;flex:1;min-height:0}
.pnotice{margin:0 0 14px;padding:9px 13px;border-radius:7px;background:var(--amber-bg);
         border:1px solid var(--amber-line);font-family:var(--ui);font-size:13px;
         color:var(--amber);display:flex;justify-content:space-between;gap:10px;
         align-items:center;flex-wrap:wrap}
.pnotice button{border:1px solid var(--amber-line);background:#fff;color:var(--amber);
       border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}

/* ---------- passage typography ---------- */
.ptitle{text-align:center;font-size:19px;margin:6px 0 2px;font-family:var(--serif)}
.byline{text-align:center;font-style:italic;margin-bottom:16px;font-size:15px}
.phead{font-size:15.5px;font-style:italic;margin:20px 0 6px}
.pintro{font-style:italic;border-left:3px solid var(--rule);padding-left:14px;
        margin:6px 0 18px;color:#39445a}
.ppara{margin:11px 0;display:flex;gap:10px;align-items:flex-start}
.pnum{flex:none;width:20px;font-weight:700;font-size:13px;color:var(--ink-faint);
      font-family:var(--ui);padding-top:3px}
.pcredit,.pnote{font-size:13.5px;color:var(--ink-soft);font-style:italic;margin:12px 0 0}
.pnote{font-style:normal}
.stanza{margin:16px 0}
@media (max-width:900px){.stanza{font-size:14.5px}}
@media (max-width:620px){.stanza{font-size:12.5px;line-height:1.5}}
@media (max-width:430px){.stanza{font-size:11px}.pbody{padding-left:16px;padding-right:16px}}
.pline{display:flex;gap:12px}
.lnum{flex:none;width:22px;text-align:right;color:var(--ink-faint);font-size:12.5px;
      font-family:var(--ui);padding-top:3px}
.pfig{margin:18px 0;text-align:center}
.pfig img{max-width:100%;height:auto;border:1px solid var(--rule);border-radius:4px}

/* ---------- question body ---------- */
.stem{font-size:18.5px;line-height:1.58}
.stem p{margin:0 0 12px}
.stem ul{margin:10px 0 12px;padding-left:22px}
.stem blockquote{margin:12px 0;padding:12px 16px;background:#f7f9fc;
       border-left:3px solid #c3ccd9;border-radius:0 6px 6px 0;font-family:var(--serif);
       font-size:17px;line-height:1.55}
.disp{text-align:center;margin:18px 0;font-size:19px}
.disp.stack{line-height:2}
.qfig{text-align:center;margin:16px 0}
.stem svg{max-width:100%;height:auto}
.grid-in{margin-top:22px}
.grid-in label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);
     letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.grid-in input{width:230px;font-size:24px;font-family:inherit;font-weight:600;
     padding:11px 14px;border:1.5px solid var(--rule);border-radius:8px;color:var(--ink)}
.grid-in input:focus{outline:none;border-color:var(--accent);
     box-shadow:0 0 0 3px rgba(47,111,176,.16)}
.hint{font-size:13px;color:var(--ink-faint);margin-top:9px}
.qfig svg{max-width:min(100%,470px);height:auto}
.frac{display:inline-block;vertical-align:middle;text-align:center;
      font-size:.92em;line-height:1.15;margin:0 2px}
.frac .num{display:block;padding:0 3px}
.frac .den{display:block;border-top:1px solid currentColor;padding:0 3px}
.ovl{border-top:1px solid currentColor}
sup{font-size:.72em;vertical-align:super;line-height:0}
sub{font-size:.72em;vertical-align:sub;line-height:0}
.tbl-title{text-align:center;font-size:14.5px;margin-bottom:7px;font-weight:600}
table.data{border-collapse:collapse;margin:0 auto 14px}
table.data th,table.data td{border:1px solid var(--ink);padding:5px 14px;
      font-size:15px;text-align:center}

/* ---------- choices ---------- */
.choices{margin-top:22px;display:flex;flex-direction:column;gap:9px}
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
        background:#fff;border:1.5px solid var(--rule);border-radius:8px;
        padding:13px 16px;cursor:pointer;font-size:17.5px;line-height:1.5;color:var(--ink);
        transition:border-color .12s,background .12s}
.choice:hover{border-color:#b9c4d4;background:#fafbfd}
.choice .ltr{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid #c3ccd9;
        display:flex;align-items:center;justify-content:center;font-size:13.5px;
        font-weight:700;color:var(--ink-soft);margin-top:1px}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice.on .ltr{background:var(--accent);border-color:var(--accent);color:#fff}
.choice:focus-visible{outline:3px solid #9dc3ec;outline-offset:2px}

/* ---------- actions ---------- */
.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;
      margin-top:26px;padding-top:18px;border-top:1px solid var(--rule)}
.note{font-size:13px;color:var(--ink-faint);max-width:380px}
.btns{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:none;border-radius:8px;padding:13px 24px;font-size:16px;font-weight:600;
     cursor:pointer;transition:background .12s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-deep)}
.arrow.back{background:#fff;color:var(--ink-soft);border:1.5px solid var(--rule)}
.arrow.back:hover{background:#f3f5f9;color:var(--ink);border-color:var(--ink-soft)}
.setpos{font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);border-left:1px solid var(--rule);padding-left:10px}
@media (max-width:760px){.setpos{border-left:0;padding-left:0}}
.btn-ghost{background:none;color:var(--ink-soft);border:1.5px solid var(--rule);
     padding:12px 18px}
.btn-ghost:hover{background:#f3f5f9;color:var(--ink)}
.btn:focus-visible{outline:3px solid #9dc3ec;outline-offset:2px}
.arrow{width:60px;height:60px;border-radius:50%;border:none;background:var(--accent);
     color:#fff;font-size:27px;line-height:1;cursor:pointer;display:flex;
     align-items:center;justify-content:center;transition:background .12s,transform .12s}
.arrow:hover{background:var(--accent-deep);transform:translateX(2px)}
.arrow.finish{background:var(--ok)}
.arrow.finish:hover{background:#136c34;transform:none}
.arrow:focus-visible{outline:3px solid #9dc3ec;outline-offset:3px}

/* ---------- start / results ---------- */
.rules{list-style:none;padding:0;margin:0 0 6px}
.rules li{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule);
      font-size:16px;color:var(--ink-soft)}
.rules li:last-child{border-bottom:none}
.rules b{color:var(--ink);font-weight:650;flex:none;width:150px}
.picks{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 6px}
.pick{flex:1;min-width:210px;text-align:left;background:#fff;border:1.5px solid var(--rule);
      border-radius:10px;padding:16px 18px;cursor:pointer;transition:border-color .12s,background .12s}
.pick:hover{border-color:var(--accent);background:var(--accent-soft)}
.pick b{display:block;font-size:17px;margin-bottom:3px}
.pick span{font-size:13.5px;color:var(--ink-faint)}
.stats{display:flex;gap:34px;margin:6px 0 22px;flex-wrap:wrap}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint)}
.stat .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
table.sheet{width:100%;border-collapse:collapse;margin-top:6px}
table.sheet th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-faint);border-bottom:1.5px solid var(--rule);padding:8px 10px}
table.sheet td{border-bottom:1px solid #eef1f6;padding:8px 10px;font-size:15.5px;
      font-variant-numeric:tabular-nums}
table.sheet td.q{color:var(--ink-faint);width:52px}
.blank{color:var(--danger);font-weight:650}
.right{color:var(--ok);font-weight:650}
.wrong{color:var(--danger);font-weight:650}
.missed{font-size:16.5px;font-weight:600;color:var(--danger);margin:0 0 4px;
      font-variant-numeric:tabular-nums;line-height:1.6}
.sheetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 26px}
@media(max-width:800px){.sheetgrid{grid-template-columns:1fr}}

/* ---------- dialog / print ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(16,24,38,.55);
      display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modal-card{background:#fff;border-radius:12px;padding:26px 28px;max-width:430px;width:100%;
      box-shadow:0 18px 50px rgba(10,18,32,.3)}
.modal-card h3{margin:0 0 8px;font-size:18px}
.modal-card p{margin:0 0 20px;color:var(--ink-soft);font-size:15px}
.modal-btns{display:flex;justify-content:flex-end;gap:10px}
.printhead{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.ph-title{font-size:15px;font-weight:700}
.ph-meta{font-size:13px;color:var(--ink-soft);margin-top:3px}
.namefield{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.namefield label{font-size:13px;font-weight:600;color:var(--ink-soft);width:104px}
.namefield input{flex:1;min-width:210px;max-width:300px;font-family:var(--ui);font-size:15px;
      padding:8px 12px;border:1.5px solid #c3ccd9;border-radius:8px}
.namefield input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tip{font-size:12.5px;color:var(--ink-faint);margin-top:10px}

@media(max-width:900px){
  .split{grid-template-columns:1fr}
  .pane.passage{position:static;max-height:52vh}
  .pane.qs{padding:22px 20px}
}
@media(max-width:640px){
  .card{padding:22px 18px}
  .bar-in{padding:9px 14px}.wrap{padding:0 12px}
  h1{font-size:22px}.stem,.choice{font-size:16.5px}
  .actions{flex-direction:column;align-items:stretch}
  .btns{justify-content:space-between}.note{max-width:none}
  .arrow{width:54px;height:54px;font-size:25px}
  .rules b{width:auto}
  .rules li{flex-direction:column;gap:2px}
}
@media print{
  @page{margin:14mm}
  .bar,.track,.actions,.noprint,.modal,.namefield{display:none!important}
  body{background:#fff;font-size:12px}
  .wrap{max-width:none;padding:0}
  .card{border:none;margin:0;padding:0;border-radius:0}
  h1{font-size:18px;margin-bottom:6px}
  h2{font-size:13px;margin:14px 0 6px}
  .stats{gap:24px;margin:4px 0 12px}.stat .v{font-size:19px}
  .sheetgrid{gap:0 18px}
  table.sheet td,table.sheet th{padding:2.5px 7px;font-size:11px}
  tr{page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- content helpers ---------- */
.stanzagap{height:14px}
.tw{margin:16px 0;text-align:center}
.tt{font-family:var(--ui);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:7px}
table.data{border-collapse:collapse;margin:0 auto;font-size:16px}
table.data th,table.data td{border:1px solid #b9c4d1;padding:6px 16px;text-align:center}
table.data th{background:#eef2f7;font-weight:600}
p.ent{font-size:15.5px;color:var(--ink-soft);margin:10px 0 4px}
.rep{border-top:1.4px solid currentColor;padding:0 1px}
.rad{border-top:1.1px solid currentColor;padding:0 2px 0 1px;margin-left:-1px}

/* ---------- answer eliminator ---------- */
.pickwrap{display:flex;align-items:flex-start;gap:13px;flex:1;text-align:left;
  background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.crow{display:flex;align-items:flex-start;gap:13px;width:100%;
  border:1.5px solid var(--rule);border-radius:11px;padding:15px 17px;background:#fff;
  position:relative}
.crow:hover{border-color:#b9c4d4;background:#fafbfd}
.crow.on{border-color:var(--accent);background:var(--accent-soft)}
.crow.on .ltr{background:var(--accent);border-color:var(--accent);color:#fff}
.crow .ct{flex:1}
.elim{flex:none;width:30px;height:30px;border-radius:50%;border:1.4px solid var(--rule);
      background:#fff;color:var(--ink-faint);font-family:var(--ui);font-size:15px;
      line-height:1;cursor:pointer;align-self:center;margin-left:10px;padding:0}
.elim:hover{border-color:#b42318;color:#b42318;background:#fdf3f2}
.crow.struck .ct,.crow.struck .ltr{text-decoration:line-through;opacity:.42}
.crow.struck .elim{border-color:#b42318;color:#b42318;background:#fdf3f2}
.elimhint{font-size:13.5px;color:var(--ink-faint);font-family:var(--ui);margin:10px 0 0}
.crow .box{flex:none;width:21px;height:21px;border:1.7px solid var(--rule);border-radius:4px;
  background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;
  color:#fff;align-self:center}
.crow.on .box{background:var(--accent);border-color:var(--accent)}
.pickmsg{font-family:var(--ui);font-size:13.5px;margin-top:10px;color:var(--ink-soft)}
.pickmsg.full{color:#15803d}

/* ---------- tech-enhanced items ---------- */
table.rt{border-collapse:collapse;margin:16px auto 4px;font-size:16px;min-width:74%}
table.rt th,table.rt td{border:1px solid #b9c4d1;padding:10px 14px;text-align:center}
table.rt th{background:#eef2f7;font-weight:600;font-family:var(--ui);font-size:14px}
table.rt td.lab{text-align:left;font-size:17px}
.rdo{width:21px;height:21px;border:1.7px solid var(--rule);border-radius:50%;background:#fff;
     cursor:pointer;display:inline-block;padding:0}
.rdo.on{border-color:var(--accent);border-width:6px}
.ddline{margin:14px 0;font-size:18px;line-height:1.7}
.ddline select{font:inherit;font-size:16px;padding:5px 8px;border:1.5px solid var(--rule);
     border-radius:6px;background:#fff;color:var(--ink);margin:0 4px}
.tray{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 6px}
.tok{font-family:var(--ui);font-size:15px;font-weight:600;color:var(--accent);
     border:1.5px solid var(--accent);border-radius:7px;padding:7px 15px;background:#fff;
     cursor:pointer}
.tok.held{background:var(--accent);color:#fff}
.tok.used{opacity:.3;cursor:default}
.dropcell{min-width:96px;height:38px;border:1.6px dashed #9fb0c4;border-radius:6px;
     background:#fbfcfe;cursor:pointer;display:flex;align-items:center;justify-content:center;
     font-weight:600;color:var(--accent);margin:0 auto}
.dropcell.filled{border-style:solid;border-color:var(--accent);background:#eef4fb}
.dropcell.target{border-color:var(--accent);background:#e8f0fa}
.exprbox{width:100%!important;font-size:22px;font-family:var(--serif);padding:12px 14px;
     border:1.5px solid var(--rule);border-radius:8px;color:var(--ink);box-sizing:border-box}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:12px;
     border:1.5px solid var(--accent);border-radius:9px;padding:9px;background:#f7f9fc}
.pal button{font-family:var(--serif);font-size:18px;padding:9px 0;background:#eef2f7;
     border:1px solid #d3dbe5;border-radius:6px;cursor:pointer;color:var(--ink)}
.pal button.util{font-family:var(--ui);font-size:14px;background:#fff}
@media (max-width:620px){.pal{grid-template-columns:repeat(5,1fr)}}

/* ---------- start screen ---------- */
.paper{margin:16px 0 0;padding:12px 15px;border-radius:8px;background:var(--amber-bg);
   border:1px solid var(--amber-line);font-family:var(--ui);font-size:14.5px;
   line-height:1.5;color:#6b4e14}
.paper b{color:#5a400c}
.backlink{background:none;border:0;padding:0;font-family:var(--ui);font-size:14px;
   color:var(--accent);cursor:pointer;margin-top:18px}

/* ---------- highlighter ---------- */
mark.hl{background:#ffe6a0;color:inherit;border-radius:2px;padding:.5px 0;cursor:pointer;
  box-shadow:0 0 0 1px rgba(201,154,22,.3)}
mark.hl:hover{background:#ffd978}
[data-hl]{-webkit-user-select:text;user-select:text}
.hlbar{position:absolute;z-index:70}
.hlbar button{font-family:var(--ui);font-size:12.5px;font-weight:600;color:#fff;
  background:#1f2b3d;border:0;border-radius:7px;padding:7px 12px;cursor:pointer;
  box-shadow:0 5px 16px rgba(16,24,40,.3);white-space:nowrap}
.hlbar button:hover{background:#2d3d55}
.hlhint{font-family:var(--ui);font-size:12px;color:var(--ink-soft);margin:10px 0 0}
</style>
</head>
<body>
<header class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="brand">SHSAT Practice <span id="secname"></span></div>
    <div class="count" id="count"></div>
  </div>
</header>
<div class="track" id="track" hidden><i id="trackbar" style="width:0%"></i></div>
<main id="app"></main>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-h">
  <div class="modal-card">
    <h3 id="modal-h">Are you sure?</h3>
    <p id="modal-p"></p>
    <div class="modal-btns">
      <button class="btn btn-ghost" id="modal-no">Cancel</button>
      <button class="btn btn-primary" id="modal-yes">Confirm</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var DATA = {"sections": [{"key": "ela", "label": "English Language Arts", "items": [{"sec": "ela", "n": 1, "type": "mc", "stem": "How does paragraph 9 fit into the overall structure of the excerpt?", "lead": null, "quote": null, "opts": ["It establishes that this is a meeting between two satiric adversaries.", "It illustrates the calmness of Holmes in the face of possible danger.", "It highlights the somewhat unseasonable weather.", "It describes the degree of Dr. Roylott&rsquo;s anger."], "text": "speckled", "grp": "speckled", "fig": null, "ai": 1}, {"sec": "ela", "n": 2, "type": "mc", "stem": "Which statement best describes how his stepdaughter&rsquo;s visit to Holmes affects Dr. Roylott?", "lead": null, "quote": null, "opts": ["It leads him to try to frighten Holmes into staying out of his affairs.", "It leads him to physically attack both Holmes and Dr. Watson.", "It leads him to deny the accusations that his stepdaughter has made against him.", "It leads him to warn Holmes that his stepdaughter will suffer if Holmes continues to investigate."], "text": "speckled", "grp": "speckled", "fig": null, "ai": 0}, {"sec": "ela", "n": 3, "type": "mc", "stem": "The words &ldquo;scoundrel&rdquo; and &ldquo;meddler&rdquo; in paragraph 10 contribute to the meaning of the paragraph by", "lead": null, "quote": null, "opts": ["conveying that Dr. Roylott is a violent, unhinged person who does not care whom he attacks.", "underlining that Dr. Roylott knows enough about Holmes to view him as a threat.", "emphasizing that Dr. Roylott is taking care not to come across as potentially guilty.", "revealing that Dr. Roylott knows exactly who Holmes is and what he does for a living."], "text": "speckled", "grp": "speckled", "fig": null, "ai": 1}, {"sec": "ela", "n": 4, "type": "mc", "stem": "How does the author&rsquo;s use of various insults in paragraphs 10&ndash;14 contribute to the development of ideas in the passage?", "lead": null, "quote": null, "opts": ["They reveal that Dr. Roylott will insult every man that he meets.", "They illustrate that Holmes is calm until his profession is called into question.", "They demonstrate that Dr. Roylott is trying and failing to make Holmes afraid of him.", "They highlight the ever-increasing outrage that Holmes feels."], "text": "speckled", "grp": "speckled", "fig": null, "ai": 2}, {"sec": "ela", "n": 5, "type": "mc", "stem": "How does paragraph 17 fit into the overall structure of the excerpt?", "lead": null, "quote": null, "opts": ["It introduces a shift from the perspective of Dr. Roylott to that of Dr. Watson.", "It emphasizes that neither Dr. Roylott nor his stepdaughter can intimidate Holmes.", "It offers a practical explanation for why Holmes is not afraid of Dr. Roylott.", "It indicates that the conversation between Holmes and Dr. Roylott is now over."], "text": "speckled", "grp": "speckled", "fig": null, "ai": 3}, {"sec": "ela", "n": 6, "type": "mc", "stem": "Which sentence best supports the idea that Holmes is confident in his ability to defend himself against Dr. Roylott?", "lead": null, "quote": null, "opts": ["&ldquo;&lsquo;Pray take a seat.&rsquo;&rdquo; (paragraph 5)", "&ldquo;Holmes chuckled heartily. &lsquo;Your conversation is most entertaining,&rsquo; said he.&rdquo; (paragraph 15)", "&ldquo;&lsquo;He seems a very amiable person,&rsquo; said Holmes, laughing.&rdquo; (paragraph 18)", "&ldquo;&lsquo;. . . if he had remained I might have shown him that my grip was not much more feeble than his own.&rsquo;&rdquo; (paragraph 18)"], "text": "speckled", "grp": "speckled", "fig": null, "ai": 3}, {"sec": "ela", "n": 7, "type": "mc", "stem": "Which statement best describes the central idea of the passage?", "lead": null, "quote": null, "opts": ["The armor used in the medieval era was closely related to the types of weapons used in warfare.", "Medieval mail armor has a long history, including a complicated production process and some modern uses.", "The revival of Roman arms technology in the medieval era enabled the use of chain mail to spread.", "Body armor and its production process have continued to evolve since Roman times."], "text": "chainmail", "grp": "chainmail", "fig": null, "ai": 1}, {"sec": "ela", "n": 8, "type": "mc", "stem": "In paragraph 3, how does the word &ldquo;master&rdquo; contribute to the meaning of the paragraph?", "lead": null, "quote": null, "opts": ["It emphasizes that the maillers owned the armor they made.", "It indicates that the makers of mail shirts were elders.", "It defines the maillers as teachers.", "It describes the makers of mail shirts as experts."], "text": "chainmail", "grp": "chainmail", "fig": null, "ai": 3}, {"sec": "ela", "n": 9, "type": "mc", "stem": "How does paragraph 3 fit into the overall structure of the passage?", "lead": null, "quote": null, "opts": ["It describes the labor-intensive process of making mail, helping to explain why the armor was so costly.", "It elaborates on the advantages of chain mail against various types of weapons on the medieval battlefield.", "It highlights how the development of weaponry affects offensive and defensive military technology over time.", "It contrasts the initial exclusivity of chain mail to wealthy medieval elites with its later spread to the lower classes."], "text": "chainmail", "grp": "chainmail", "fig": null, "ai": 0}, {"sec": "ela", "n": 10, "type": "mc", "stem": "What is the most likely reason chain mail was not commonly used in the ancient Roman era?", "lead": null, "quote": null, "opts": ["Ancient Roman &ldquo;linked mail armor&rdquo; was less effective than the armor made in the fourteenth century.", "The improved stabbing and piercing weapons used by Rome&rsquo;s military opponents made flexible mail armor impractical.", "Armor made from segmented steel plates was unsuitable for wear by Roman cavalry troops.", "The segmented breastplate was a more practical form of protection for Roman infantry than flexible mail armor."], "text": "chainmail", "grp": "chainmail", "fig": null, "ai": 3}, {"sec": "ela", "n": 11, "type": "mc", "stem": "Which sentence best supports the idea that chain mail became less effective as a form of defense on the battlefield?", "lead": null, "quote": null, "opts": ["&ldquo;It combined the flexibility and suppleness of cloth with the impact-absorbing mass and cut resistance of rigid metal plates.&rdquo; (paragraph 2)", "&ldquo;Moreover, when struck with a blunt object, the links transfer much of the force through the mass of the garment, absorbing a significant amount of impact instead of allowing it to pass to the soft tissues of the wearer beneath.&rdquo; (paragraph 2)", "&ldquo;For the nobility, the need for greater protection spurred the development of armors revolving around cleverly articulated rigid steel plates instead.&rdquo; (paragraph 4)", "&ldquo;Today, in addition to traditional maillers, modern maillers produce chain mail with premade wire, electric motors, and pneumatic tools for costumes for Renaissance festivals, movies, theme parks, medieval restaurants, and fantasy hobbyists.&rdquo; (paragraph 5)"], "text": "chainmail", "grp": "chainmail", "fig": null, "ai": 2}, {"sec": "ela", "n": 12, "type": "mc", "stem": "In paragraph 4, the idea that chain mail was once considered very valuable is illustrated mainly through the", "lead": null, "quote": null, "opts": ["tedious, labor-intensive process for creating mail armor.", "use of chain armor by the peasant class.", "superior durability of medieval mail armor.", "quick removal and reuse of armor from fallen soldiers."], "text": "chainmail", "grp": "chainmail", "fig": null, "ai": 3}, {"sec": "ela", "n": 13, "type": "mc", "stem": "With which statement would the author of this passage most likely agree?", "lead": null, "quote": null, "opts": ["Linked-metal armor represented a practical solution to a technological need in a particular historical era.", "Military technologies in the era of steel hand weapons succeeded primarily because of the existence of an adequate network of skilled craftsmen to support them.", "The availability of practical mail armor was limited mainly to the fourteenth century.", "Linked-metal armor was of such limited usefulness that it became obsolete as soon as the superior technology of articulated metal plates became widespread."], "text": "chainmail", "grp": "chainmail", "fig": null, "ai": 0}, {"sec": "ela", "n": 14, "type": "mc", "stem": "According to the passage, the Alvarez theory that the iridium layer was deposited by a meteorite rather than by volcanic action is supported by evidence that", "lead": null, "quote": null, "opts": ["proves that the Yucatan crater was created by a meteor strike.", "describes the only way in which a large enough dust and rock cloud could be generated to disrupt the food chain.", "indicates that iridium is evenly distributed in sediments worldwide.", "shows that geologists agree that iridium is rare on the surface of the Earth."], "text": "asteroid", "grp": "asteroid", "fig": null, "ai": 2}, {"sec": "ela", "n": 15, "type": "mc", "stem": "In paragraph 4, the author notes that &ldquo;Neither Luis nor Walter Alvarez was a paleontologist&rdquo; mainly to suggest that", "lead": null, "quote": null, "opts": ["the Alvarezes were not qualified to analyze the iridium samples on which their theory was based.", "the Alvarez theory was eventually rejected because neither scientist had studied dinosaurs.", "paleontologists doubted the theory partly because it came from scientists outside their field who claimed to have solved a long-standing problem.", "paleontologists had already considered and rejected the possibility of a meteorite strike."], "text": "asteroid", "grp": "asteroid", "fig": null, "ai": 2}, {"sec": "ela", "n": 16, "type": "mc", "stem": "The author mentions the global food chain in paragraph 2 in order to", "lead": null, "quote": null, "opts": ["refute the theory that an epidemic was responsible for dinosaur extinction.", "illustrate the importance of a clean atmosphere for life on Earth.", "support the contention that dinosaurs were primarily plant-eaters.", "explain how the cloud of dust caused the extinction of dinosaurs."], "text": "asteroid", "grp": "asteroid", "fig": null, "ai": 3}, {"sec": "ela", "n": 17, "type": "mc", "stem": "What is the most likely reason the discovery of a layer of iridium in geologic sediments was considered unusual?", "lead": null, "quote": null, "opts": ["Iridium had never been detected there before.", "Iridium is normally quite scarce at the Earth&rsquo;s surface.", "Iridium only occurs in meteoric craters.", "Iridium is normally found only deep within the Earth&rsquo;s core."], "text": "asteroid", "grp": "asteroid", "fig": null, "ai": 1}, {"sec": "ela", "n": 18, "type": "mc", "stem": "The phrase &ldquo;coupled with&rdquo; conveys the idea that the lack of plants", "lead": "Read this sentence from paragraph 2.", "quote": "The lack of plants as a food source, coupled with a significant drop in temperature, resulted in the extinction of the dinosaurs.", "opts": ["resulted from the meteorite impact.", "combined with falling temperatures to cause dinosaur extinction.", "was less important than the drop in temperature in causing the extinction.", "caused the dinosaurs to go extinct due to starvation."], "text": "asteroid", "grp": "asteroid", "fig": null, "ai": 1}, {"sec": "ela", "n": 19, "type": "mc", "stem": "Which sentence best supports the idea that paleontologists initially had reason to be critical of the Alvarez theory?", "lead": null, "quote": null, "opts": ["&ldquo;Although various explanations for this disappearance have been offered, ranging from an epidemic to a sudden, catastrophic drop in temperature, no theory has yet been conclusively proven.&rdquo; (paragraph 1)", "&ldquo;His research team discovered that a thin layer of the metal iridium had been deposited all over the world at approximately the time the dinosaurs died out.&rdquo; (paragraph 3)", "&ldquo;[T]he &lsquo;doomsday&rsquo; meteorite would have had to be about 5 miles in diameter, and its impact would have formed a crater perhaps a hundred miles wide.&rdquo; (paragraph 4)", "&ldquo;New deepwater samples of melted rock from the crater itself were recently analyzed by an advanced dating process, however, and were found to be 64.98 million years old.&rdquo; (paragraph 5)"], "text": "asteroid", "grp": "asteroid", "fig": null, "ai": 2}, {"sec": "ela", "n": 20, "type": "mc", "stem": "Paragraph 5 contributes to the development of the central idea of the passage by", "lead": null, "quote": null, "opts": ["describing evidence that helped convince many scientists that the Alvarez theory was correct.", "revealing that the impact crater was far older than 65 million years.", "rejecting the majority opinion of paleontologists.", "explaining why the oil geologists who found the crater in 1981 did not connect it to the dinosaurs."], "text": "asteroid", "grp": "asteroid", "fig": null, "ai": 0}, {"sec": "ela", "n": 21, "type": "mc", "stem": "Which statement best describes the central idea of the passage?", "lead": null, "quote": null, "opts": ["Birds rely mainly on colorful plumage both to attract mates and to identify members of their own species.", "The mating activities of birds involve several different types of behaviors and approaches.", "Bird calls provide important migratory directions in addition to playing a key role in courtship.", "A &ldquo;pair bond&rdquo; generally lasts at least as long as it takes the two birds to create a nest, if not longer."], "text": "birds", "grp": "birds", "fig": null, "ai": 1}, {"sec": "ela", "n": 22, "type": "mc", "stem": "Which sentence best supports the idea that male bird calls help a female find a suitable mate before mating takes place?", "lead": null, "quote": null, "opts": ["&ldquo;Later, after mating has taken place, the note patterns of a particular male&rsquo;s song enable the nesting female to continue to identify her partner.&rdquo; (paragraph 4)", "&ldquo;Males perch on tall trees and sing high-pitched, piercing notes to announce that the surrounding area is their territory.&rdquo; (paragraph 5)", "&ldquo;Identification checks allow birds to ensure that they are mating with members of their own species.&rdquo; (paragraph 1)", "&ldquo;The males of her species identify themselves by their singing and communicate to her that they are in breeding condition.&rdquo; (paragraph 4)"], "text": "birds", "grp": "birds", "fig": null, "ai": 3}, {"sec": "ela", "n": 23, "type": "mc", "stem": "The example of whooping cranes and trumpeter swans in paragraph 3 primarily serves to", "lead": null, "quote": null, "opts": ["demonstrate that aggression is the principal means by which birds establish pair bonds.", "explain how some birds use distinctive movements to identify members of competing species.", "illustrate how courtship rituals can involve coordinated participation by both males and females.", "suggest that courtship displays are most elaborate among birds whose males and females have similar plumage."], "text": "birds", "grp": "birds", "fig": null, "ai": 2}, {"sec": "ela", "n": 24, "type": "mc", "stem": "Based on paragraph 4, a male&rsquo;s singing most likely helps a female bird", "lead": null, "quote": null, "opts": ["find a male of her own species that is ready to mate.", "recognize her own chicks by the unique calls they make after hatching.", "learn the route to her breeding region from males that have already arrived there.", "compare the plumage of several males before choosing a partner."], "text": "birds", "grp": "birds", "fig": null, "ai": 0}, {"sec": "ela", "n": 25, "type": "mc", "stem": "How do paragraphs 5 and 6 contribute to the development of ideas in the passage?", "lead": null, "quote": null, "opts": ["They argue that common North American birds have more elaborate courtship rituals than exotic species such as the bird of paradise.", "They shift the focus of the passage from courtship to the care of young birds.", "They contrast birds that defend a territory with birds that rely on colorful plumage to attract mates.", "They show that the identification and courtship behaviors described earlier can be observed in common birds, not just in exotic ones."], "text": "birds", "grp": "birds", "fig": null, "ai": 3}, {"sec": "ela", "n": 26, "type": "mc", "stem": "Based on paragraphs 5 and 6, which statement best describes a difference between the courtship behaviors of the northern cardinal and the American goldfinch?", "lead": null, "quote": null, "opts": ["The male cardinal courts the female by feeding her, while the male goldfinch proves his fitness by matching the female&rsquo;s movements in flight.", "Cardinal pairs form lasting bonds, while goldfinch pairs separate as soon as their eggs are laid.", "The male cardinal attracts a female mainly through song, while the male goldfinch relies on his bright plumage.", "The male cardinal defends a territory, while the male goldfinch does not establish a territory at all."], "text": "birds", "grp": "birds", "fig": null, "ai": 0}, {"sec": "ela", "n": 27, "type": "mc", "stem": "How does the Venn diagram contribute to the development of the topic of the passage?", "lead": null, "quote": null, "opts": ["It emphasizes that the males of some avian species can use a variety of behaviors to attract a mate.", "It shows that birds are more likely to use a single courtship behavior, rather than multiple techniques.", "It indicates that some species of birds may use more than one &ldquo;identification check&rdquo; behavior.", "It tells how male birds of paradise both develop distinctive plumage and perform a dance to attract females."], "text": "birds", "grp": "birds", "fig": null, "ai": 2}, {"sec": "ela", "n": 28, "type": "mc", "stem": "Which statement best expresses the central idea of the poem?", "lead": null, "quote": null, "opts": ["The passing of time gradually changes familiar things until they become unrecognizable.", "Although nature undergoes dramatic changes, its recurring cycles bring opportunities for renewal.", "The beauty of nature is most apparent when its periods of growth are contrasted with its periods of decline.", "Observing nature closely allows people to anticipate changes that might otherwise seem unexpected."], "text": "poem", "grp": "poem", "fig": null, "ai": 1}, {"sec": "ela", "n": 29, "type": "mc", "stem": "The personification in lines 1&ndash;3 suggests that the tree", "lead": null, "quote": null, "opts": ["is a welcome sight to the speaker.", "is a strong but menacing presence.", "is a representation of the speaker&rsquo;s actual neighbor.", "is annoying the speaker by banging against the window."], "text": "poem", "grp": "poem", "fig": null, "ai": 0}, {"sec": "ela", "n": 30, "type": "mc", "stem": "How does the second stanza (lines 8&ndash;14) contribute to the poem&rsquo;s larger portrayal of the seasons?", "lead": null, "quote": null, "opts": ["It suggests that the tree is most beautiful in the spring, when it is full of birds and blossoms.", "It foreshadows the decline in the speaker&rsquo;s mood once spring ends and the birds leave.", "It presents the first in a series of seasonal portraits, each showing the tree with its own distinct sights and sounds.", "It suggests that the people and animals that interact with the tree inevitably cause it harm."], "text": "poem", "grp": "poem", "fig": null, "ai": 2}, {"sec": "ela", "n": 31, "type": "mc", "stem": "The figurative language in these lines conveys", "lead": "Read lines 19&ndash;21 from the poem.", "quote": "The relief of a gentle breeze whispers secrets through the leaves<br>And children, playing in the streets, follow the sound<br>And find shelter in the coolness of the shade.", "opts": ["the belief of the neighborhood inhabitants that the tree is mysterious.", "that the tree depends on people in order to survive the heat of summer.", "how the tree is only useful to the inhabitants of the neighborhood when it is hot outside.", "that there is a feeling of connection between the tree and the inhabitants of the neighborhood."], "text": "poem", "grp": "poem", "fig": null, "ai": 3}, {"sec": "ela", "n": 32, "type": "mc", "stem": "The comparison in lines 22&ndash;23 of the poem is used to convey", "lead": null, "quote": null, "opts": ["the harm that the colder weather has already begun to do to the tree&rsquo;s leaves.", "the speed with which the tree sheds the last of its summer green.", "the vividness of the colors that overtake the leaves as the season turns.", "the speaker&rsquo;s uneasiness about the barren winter still to come."], "text": "poem", "grp": "poem", "fig": null, "ai": 2}, {"sec": "ela", "n": 33, "type": "mc", "stem": "How does the word choice in these lines impact the mood of the poem?", "lead": "Read lines 28&ndash;29 from the poem.", "quote": "Squirrels race up and down the trunk, stashing away<br>Treasures in preparation for the growing chill.", "opts": ["by lending a note of warmth to a stanza otherwise occupied with loss", "by making the squirrels&rsquo; preparations seem frantic as the cold closes in", "by suggesting that the animals value the tree more than the speaker does", "by implying that what the tree still has to offer is nearly used up"], "text": "poem", "grp": "poem", "fig": null, "ai": 0}, {"sec": "ela", "n": 34, "type": "mc", "stem": "How does the imagery in lines 31&ndash;32 contribute to the poem&rsquo;s portrayal of winter?", "lead": null, "quote": null, "opts": ["It creates a stark, unsettling image that contrasts with the liveliness of the earlier seasons.", "It emphasizes the tree&rsquo;s vulnerability by comparing its bare branches to fragile objects.", "It depicts the tree as restless, suggesting that its branches are struggling against the cold.", "It conveys the speaker&rsquo;s disappointment that the tree no longer provides shelter for neighborhood animals."], "text": "poem", "grp": "poem", "fig": null, "ai": 0}, {"sec": "ela", "n": 35, "type": "mc", "stem": "What does the bud in line 36 represent?", "lead": null, "quote": null, "opts": ["proof that the tree has survived a winter harsher than the ones before it", "the return of a cycle the speaker has come to count on each year", "the speaker&rsquo;s wish that the seasons would stop changing", "the fragility of new growth in the face of the cold still to come"], "text": "poem", "grp": "poem", "fig": null, "ai": 1}, {"sec": "ela", "n": 36, "type": "mc", "stem": "Which statement best expresses the central argument developed throughout the passage?", "lead": null, "quote": null, "opts": ["The nation&rsquo;s rapid economic growth has depended on exploiting natural resources, making further development increasingly difficult as those resources diminish.", "The nation&rsquo;s greatest responsibility is to restore the natural resources that have already been depleted through generations of careless use.", "Because the nation&rsquo;s prosperity depends on natural resources that are being depleted, Americans must use those resources wisely to preserve prosperity for future generations.", "Although the nation&rsquo;s resources are diminishing, its history of economic growth demonstrates that Americans can overcome these challenges through continued development."], "text": "roosevelt", "grp": "roosevelt", "fig": null, "ai": 2}, {"sec": "ela", "n": 37, "type": "mc", "stem": "How does paragraph 2 develop the argument introduced in paragraph 1?", "lead": null, "quote": null, "opts": ["It qualifies the claim that natural resources are being exhausted by identifying ways in which agricultural land can still be expanded.", "It explains how the nation&rsquo;s early assumptions about its resources contributed to the economic prosperity described in paragraph 1.", "It shifts the discussion from the importance of natural resources to the technological developments that have made those resources more accessible.", "It illustrates the exhaustion of the nation&rsquo;s depletion of resources as &ldquo;thoughtlessly, and to a large degree unnecessarily.&rdquo; This language primarily serves to", "lead": null, "quote": null, "opts": ["suggest that the nation&rsquo;s pursuit of prosperity has made the depletion of natural resources an unavoidable consequence of economic progress.", "emphasize that Americans underestimated the value of their resources because they believed those resources would remain abundant.", "underscore the extent to which the nation&rsquo;s loss of natural resources resulted from preventable failures of judgment and planning.", "imply that the nation&rsquo;s leaders were aware of the consequences of resource depletion but prioritized immediate prosperity over future security."], "text": "roosevelt", "grp": "roosevelt", "fig": null, "ai": 2}, {"sec": "ela", "n": 41, "type": "mc", "stem": "In paragraph 4, the speaker&rsquo;s description of a man who owns his farm rather than renting it mainly serves to", "lead": null, "quote": null, "opts": ["compare the nation&rsquo;s duty toward its resources to an owner&rsquo;s desire to pass his property on to his children in good condition.", "argue that the government should help more families buy their own farms instead of renting them.", "explain that the practice of renting farmland caused the soil damage described in paragraph 3.", "suggest that conservation is the responsibility of individual farmers rather than of the nation as a whole."], "text": "roosevelt", "grp": "roosevelt", "fig": null, "ai": 0}, {"sec": "ela", "n": 42, "type": "mc", "stem": "Paragraph 4 contributes to the development of ideas in the passage mainly by", "lead": null, "quote": null, "opts": ["arguing that the nation&rsquo;s growth justifies the losses described in paragraphs 2 and 3.", "shifting from describing damage that has already been done to urging the nation to plan for the future.", "providing new data about how quickly coal, iron, oil, and gas are being used.", "outlini
