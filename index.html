ter of 3 inches is cut out from the center of the plate.</p><p>What is the area of the shaded region, to the nearest hundredth of a square inch?</p><p class='ent'>Enter your answer in the space.</p>", "fig": "plate", "ans": "8.93", "tol": 0.015, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 25, "topic": "Angles of a right triangle", "type": "mc", "stem": "<p>In the right triangle shown, what is the measure of the <b>smallest</b> angle?</p>", "fig": "right_triangle", "opts": ["19&deg;", "43&deg;", "47&deg;", "53&deg;"], "ai": 1, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 26, "topic": "Radius, diameter, and a chord", "type": "mc", "stem": "<p><i>P</i> is the center of the circle shown, and <i>R</i>, <i>S</i>, and <i>T</i> are points on the circle. What is the value of <i>x</i>?</p>", "fig": "circle_radius", "opts": ["4", "16", "20", "24"], "ai": 1, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 27, "topic": "Parallel lines cut by a transversal", "type": "mc", "stem": "<p>In the figure, line <i>j</i> is parallel to line <i>k</i>. What is the measure of &ang;<i>W</i>?</p>", "fig": "transversal_n", "opts": ["32&deg;", "58&deg;", "122&deg;", "148&deg;"], "ai": 2, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 28, "topic": "Scientific notation", "type": "mc", "stem": "<p class='disp'><span class=\"frac\"><span class=\"num\">18.6 &times; 10<sup>&minus;5</sup></span><span class=\"den\">3.1 &times; 10<sup>3</sup></span></span></p><p>What is the quotient of the expression above, expressed in scientific notation?</p>", "fig": null, "opts": ["6 &times; 10<sup>&minus;15</sup>", "6 &times; 10<sup>&minus;2</sup>", "6 &times; 10<sup>8</sup>", "6 &times; 10<sup>&minus;8</sup>"], "ai": 3, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 29, "topic": "Exponent rules combined", "type": "mc", "stem": "<p>Simplify:</p><p class='disp'><span class=\"frac\"><span class=\"num\"><i>n</i><sup>9</sup> &middot; <i>n</i><sup>0</sup></span><span class=\"den\"><i>n</i><sup>&minus;5</sup></span></span></p>", "fig": null, "opts": ["<i>n</i><sup>14</sup>", "0", "<i>n</i><sup>4</sup>", "<i>n</i><sup>&minus;45</sup>"], "ai": 0, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 30, "topic": "Solving a literal equation", "type": "mc", "stem": "<p>What is the value of <i>w</i> in <span class=\"frac\"><span class=\"num\"><i>x</i></span><span class=\"den\">8</span></span> + <span class=\"frac\"><span class=\"num\"><i>y</i> &minus; <i>x</i></span><span class=\"den\">4</span></span> = <span class=\"frac\"><span class=\"num\"><i>w</i></span><span class=\"den\">8</span></span>?</p>", "fig": null, "opts": ["2<i>y</i> &minus; <i>x</i>", "1", "8", "<i>y</i>"], "ai": 0, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 31, "topic": "Inverse variation of rate and time", "type": "mc", "stem": "<p>A bus trip takes 12 hours if the mean speed is 55 miles per hour. How many hours would this trip take if the mean speed were 44 miles per hour?</p>", "fig": null, "opts": ["9.6", "12", "15", "18"], "ai": 2, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 32, "topic": "Comparing unit prices", "type": "dropdown", "stem": "<p>Two student clubs are selling snacks as part of a fundraiser. The Art Club sells a 36-pack of granola bars for $21.60. The Science Club sells a 15-pack of granola bars for $10.50. To the nearest cent, what is the difference in cost per bar between the two clubs?</p><p class='ent'>Select the correct answer from each drop-down to complete the sentences.</p>", "fig": null, "parts": [["The cost for the Art Club&rsquo;s bar is ", ["$0.55", "$0.60", "$0.65", "$0.72"], 1, " per bar."], ["The cost for the Science Club&rsquo;s bar is ", ["$0.70", "$0.75", "$0.80", "$0.90"], 0, " per bar."], ["The difference between the cost of the bars is ", ["$0.05", "$0.10", "$0.15", "$0.25"], 1, "."]], "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 33, "topic": "Completing a table from a rule", "type": "dragtable", "stem": "<p>A company charges $5.00 to ship a 6-pound package. The cost includes a base fee of $2.00 plus $0.60 for each pound over the first pound. The table below shows how the cost depends on the total weight of the package. Complete the table by matching each total weight to its correct total shipping cost.</p><p class='ent'>Move the correct answer to each box. Not all answers will be used.</p>", "fig": null, "tokens": ["2.60", "3.20", "4", "5", "6.20", "7", "9", "10"], "head": ["Total Weight (pounds)", "Total Cost to Ship (dollars)"], "body": [["3", null], [null, "4.40"], ["8", null], [null, "7.40"]], "correct": ["3.20", "5", "6.20", "10"], "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 34, "topic": "Probability from a table", "type": "mc", "stem": "<p>The table shows the probabilities of a hockey team scoring different numbers of goals in a game.</p><div class='tw'><div class='tt'>HOCKEY GOAL PROBABILITIES</div><table class='data'><tr><th>Number of Goals</th><th>Probability</th></tr><tr><td>0</td><td>0.11</td></tr><tr><td>1</td><td>0.19</td></tr><tr><td>2</td><td>0.27</td></tr><tr><td>3</td><td>0.23</td></tr><tr><td>4</td><td>0.13</td></tr><tr><td>5</td><td>0.07</td></tr></table></div><p>What is the probability that the team will score three or more goals in the next game?</p>", "fig": null, "opts": ["0.20", "0.23", "0.43", "0.57"], "ai": 2, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 35, "topic": "Writing a probability expression", "type": "expr", "stem": "<p>In a school raffle, 1 out of every 40 students wins a prize. Each prize includes a randomly selected trading card from a set of 250 different cards, labeled C1 through C250, with each card equally likely to be chosen.</p><p>Write an expression that represents the probability that a student wins the prize <b>and</b> receives Card C88.</p><p class='ent'>Enter your answer in the space provided. Enter only your answer.</p>", "fig": null, "ans": ["1/40*1/250", "1/250*1/40", "(1/40)(1/250)", "(1/250)(1/40)", "(1/40)*(1/250)", "(1/250)*(1/40)", "1/(40*250)", "1/(250*40)", "1/10000", "1/10,000", "0.0001"], "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 36, "topic": "Percentage of a goal", "type": "num", "stem": "<p>Leah has set a goal to read a total of 750 pages of a textbook. The table shows the book page numbers for the reading she did during three days.</p><div class='tw'><div class='tt'>DAILY READING LOG</div><table class='data'><tr><th>Day</th><th>Pages Read</th></tr><tr><td>1</td><td>pages 61&ndash;130, inclusive</td></tr><tr><td>2</td><td>pages 200&ndash;264, inclusive</td></tr><tr><td>3</td><td>pages 310&ndash;387, inclusive</td></tr></table></div><p>What percentage of her 750-page goal did Leah read on these three days?</p><p class='ent'>Enter your answer in the space.</p>", "fig": null, "ans": "28.4", "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 37, "topic": "Combinations", "type": "mc", "stem": "<p>A company hired 8 people as summer workers. Of these 8 people, 4 will be hired as permanent employees in the fall. If 3 of the 8 people are male, how many of the possible groups of 4 people hired in the fall will include <b>only</b> 1 male?</p>", "fig": null, "opts": ["10", "15", "30", "70"], "ai": 2, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 38, "topic": "Reasoning with sets", "type": "mc", "stem": "<p>Two sets, <i>R</i> and <i>S</i>, are described below. The sum of the elements in set <i>R</i> equals the sum of the elements in set <i>S</i>.</p><p class='disp'><i>R</i> = {7, <i>x</i>, 4, 9}<br><i>S</i> = {8, <i>y</i>, 5, 3}</p><p>What is the value of <i>x</i> &minus; <i>y</i>?</p>", "fig": null, "opts": ["&minus;4", "&minus;2", "4", "6"], "ai": 0, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 39, "topic": "Evaluating a complex fraction", "type": "mc", "stem": "<p>If <i>x</i> = <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">5</span></span>, what is the value of <span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">3 &minus; <i>x</i></span></span>?</p>", "fig": null, "opts": ["<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">14</span></span>", "<span class=\"frac\"><span class=\"num\">14</span><span class=\"den\">15</span></span>", "1<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">14</span></span>", "2<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span>"], "ai": 2, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 40, "topic": "Isosceles triangles and angle chasing", "type": "mc", "stem": "<p>In the figure, point <i>D</i> lies on <i>AC</i>, with <i>AB</i> = <i>AC</i> and <i>AD</i> = <i>DB</i> = <i>BC</i>, as the tick marks show. What is the value of <i>x</i>?</p>", "fig": "isosceles_chain", "opts": ["30", "36", "45", "72"], "ai": 1, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 41, "topic": "Estimating square roots", "type": "mc", "stem": "<p>Which number has a value that is located between 9 and 10 on a number line?</p>", "fig": null, "opts": ["&radic;<span class='rad'>72</span>", "&radic;<span class='rad'>88</span>", "&radic;<span class='rad'>104</span>", "&radic;<span class='rad'>120</span>"], "ai": 1, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 42, "topic": "Estimating with pi", "type": "mc", "stem": "<p>Which of the following expressions is <b>negative</b> in value?</p>", "fig": null, "opts": ["25 &minus; 8&pi;", "7 &minus; 2&pi;", "3&pi; &minus; 9", "13 &minus; 4&pi;"], "ai": 0, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 43, "topic": "Defined operation", "type": "mc", "stem": "<p>The symbol &lang;<i>x</i>, <i>y</i>, <i>z</i>&rang; means <span class=\"frac\"><span class=\"num\"><i>xz</i> + <i>xy</i></span><span class=\"den\">2</span></span> + <i>zy</i>. What is the value of &lang;4, 3, 6&rang;?</p>", "fig": null, "opts": ["18", "30", "36", "42"], "ai": 2, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 44, "topic": "Writing an inequality from a budget", "type": "expr", "stem": "<p>Jordan has a budget of $200 to rent a booth at a fair. The rental company charges $24 per hour to rent the booth, plus a one-time setup fee of $35.</p><p>Write an inequality that represents this situation, in which <i>x</i> is the number of hours Jordan can rent the booth.</p><p class='ent'>Enter your answer in the space provided. Enter only your answer.</p>", "fig": null, "ans": ["24x+35<=200", "35+24x<=200", "24*x+35<=200", "200>=24x+35", "200>=35+24x"], "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 45, "topic": "Intersection of two lines", "type": "mc", "stem": "<p>What is the point of intersection of the graphs of <i>y</i> = &minus;5<i>x</i> + 4 and <i>y</i> = 3<i>x</i> &minus; 2?</p>", "fig": null, "opts": ["(&minus;<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">4</span></span>, <span class=\"frac\"><span class=\"num\">31</span><span class=\"den\">4</span></span>)", "(<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">4</span></span>, &minus;<span class=\"frac\"><span class=\"num\">17</span><span class=\"den\">4</span></span>)", "(&minus;<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">4</span></span>, <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>)", "(<span class=\"frac\"><span class=\"num\">3</span><span class=\"den\">4</span></span>, <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">4</span></span>)"], "ai": 3, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 46, "topic": "Similar triangles with a variable", "type": "mc", "stem": "<p>In the figure, &#9651;<i>MPR</i> is similar to &#9651;<i>NPQ</i>. If <i>NP</i> is 6 centimeters and <i>NQ</i> is 12 centimeters, what is the length of <span style='text-decoration:overline'><i>MR</i></span> in terms of <i>x</i>?</p>", "fig": "similar_mpr", "opts": ["2<i>x</i>", "2<i>x</i> + 12", "<i>x</i> + 6", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">2</span></span><i>x</i> + 6"], "ai": 1, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 47, "topic": "System from a context", "type": "mc", "stem": "<p>To determine the price of servicing a car, a mechanic charges a fixed fee plus an hourly rate for each hour he works. If his price for 5 hours of work is $340, and his price for 8 hours of work is $499, what is the fixed fee that the mechanic charges?</p>", "fig": null, "opts": ["$53", "$75", "$87", "$159"], "ai": 1, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 48, "topic": "Building equations from a context", "type": "dropdown", "stem": "<p>A container initially contains <i>n</i> gallons of water. A student adds 18 gallons of water, making the container 60% full. After the student adds 12 more gallons of water, the container is 80% full.</p><p class='ent'>Select the correct answers from each drop-down to complete the sentences.</p><p>Let <i>x</i> represent the total number of gallons the container can hold.</p>", "fig": null, "parts": [["The equation that represents the situation immediately after the student adds 18 gallons of water is <i>n</i> + 18 = ", ["0.6<i>x</i>", "0.8<i>x</i>", "60<i>x</i>", "18<i>x</i>"], 0, "."], ["The equation that represents the situation after the student adds 12 more gallons of water is <i>n</i> + 30 = ", ["0.6<i>x</i>", "0.8<i>x</i>", "80<i>x</i>", "30<i>x</i>"], 1, "."], ["The number of gallons, <i>n</i>, in the container initially is ", ["12", "18", "36", "60"], 1, " gallons."]], "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 49, "topic": "Perimeter and side ratios", "type": "mc", "stem": "<p>The perimeter of square <i>W</i> is three times the perimeter of equilateral triangle <i>X</i>. What is the ratio of the length of one side of square <i>W</i> to the length of one side of equilateral triangle <i>X</i>?</p>", "fig": null, "opts": ["3:4", "4:9", "3:1", "9:4"], "ai": 3, "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}, {"n": 50, "topic": "Reasoning about a defined function", "type": "num", "stem": "<p>Assume <i>S</i>(<i>x</i>) equals the sum of all positive <b>odd</b> integers less than or equal to <i>x</i>. What is the value of <i>S</i>(15)?</p><p class='ent'>Enter your answer in the space.</p>", "fig": null, "ans": "64", "sec": "math", "lead": null, "quote": null, "grp": null, "text": null}]}], "texts": {"speckled": {"label": "The Speckled Band", "html": "<h3 class=\"ptitle\">Excerpt from &ldquo;The Adventure of the Speckled Band&rdquo;</h3><div class=\"byline\">by Sir Arthur Conan Doyle</div><p class=\"pintro\">In this excerpt, renowned detective Sherlock Holmes and his companion and chronicler Dr. Watson have received an early morning visit from a distraught woman, afraid for her life. The stepdaughter of Dr. Grimesby Roylott, she has witnessed the mysterious death of her sister and been ill-treated by her stepfather, a violent and unpredictable man who unexpectedly bursts in on Holmes and Watson.</p><p class=\"ppara\"><span class=\"pnum\">1</span><span>[O]ur door had been suddenly dashed open, and . . . a huge man had framed himself in the aperture. His costume was a peculiar mixture of the professional and of the agricultural, having a black top-hat, a long frock-coat, and a pair of high gaiters, with a hunting crop swinging in his hand. So tall was he that his hat actually brushed the crossbar of the doorway, and his breadth seemed to span it across from side to side. A large face, seared with a thousand wrinkles, burned yellow with the sun, and marked with every evil passion, was turned from one to the other of us, while his deep-set, bile-shot eyes, and his high, thin, fleshless nose, gave him somewhat the resemblance to a fierce old bird of prey.</span></p><p class=\"ppara\"><span class=\"pnum\">2</span><span>&ldquo;Which of you is Holmes?&rdquo; asked this apparition.</span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>&ldquo;My name, sir; but you have the advantage of me,&rdquo; said my companion quietly.</span></p><p class=\"ppara\"><span class=\"pnum\">4</span><span>&ldquo;I am Dr. Grimesby Roylott, of Stoke Moran.&rdquo;</span></p><p class=\"ppara\"><span class=\"pnum\">5</span><span>&ldquo;Indeed, Doctor,&rdquo; said Holmes blandly. &ldquo;Pray take a seat.&rdquo;</span></p><p class=\"ppara\"><span class=\"pnum\">6</span><span>&ldquo;I will do nothing of the kind. My stepdaughter has been here. I have traced her. What has she been saying to you?&rdquo;</span></p><p class=\"ppara\"><span class=\"pnum\">7</span><span>&ldquo;It is a little cold for the time of the year,&rdquo; said Holmes.</span></p><p class=\"ppara\"><span class=\"pnum\">8</span><span>&ldquo;What has she been saying to you?&rdquo; screamed the old man furiously.</span></p><p class=\"ppara\"><span class=\"pnum\">9</span><span>&ldquo;But I have heard that the crocuses promise well,&rdquo; continued my companion imperturbably.</span></p><p class=\"ppara\"><span class=\"pnum\">10</span><span>&ldquo;Ha! You put me off, do you?&rdquo; said our new visitor, taking a step forward and shaking his hunting crop. &ldquo;I know you, you scoundrel! I have heard of you before. You are Holmes, the meddler.&rdquo;</span></p><p class=\"ppara\"><span class=\"pnum\">11</span><span>My friend smiled.</span></p><p class=\"ppara\"><span class=\"pnum\">12</span><span>&ldquo;Holmes, the busybody!&rdquo;</span></p><p class=\"ppara\"><span class=\"pnum\">13</span><span>His smile broadened.</span></p><p class=\"ppara\"><span class=\"pnum\">14</span><span>&ldquo;Holmes, the Scotland Yard Jack-in-office!&rdquo;</span></p><p class=\"ppara\"><span class=\"pnum\">15</span><span>Holmes chuckled heartily. &ldquo;Your conversation is most entertaining,&rdquo; said he. &ldquo;When you go out close the door, for there is a decided draught.&rdquo;</span></p><p class=\"ppara\"><span class=\"pnum\">16</span><span>&ldquo;I will go when I have said my say. Don&rsquo;t you dare to meddle with my affairs. I know that Miss Stoner has been here. I traced her! I am a dangerous man to fall foul of! See here.&rdquo; He stepped swiftly forward, seized the poker, and bent it into a curve with his huge brown hands.</span></p><p class=\"ppara\"><span class=\"pnum\">17</span><span>&ldquo;See that you keep yourself out of my grip,&rdquo; he snarled, and hurling the twisted poker into the fireplace he strode out of the room.</span></p><p class=\"ppara\"><span class=\"pnum\">18</span><span>&ldquo;He seems a very amiable person,&rdquo; said Holmes, laughing. &ldquo;I am not quite so bulky, but if he had remained I might have shown him that my grip was not much more feeble than his own.&rdquo; As he spoke he picked up the steel poker and, with a sudden effort, straightened it out again.</span></p><p class=\"ppara\"><span class=\"pnum\">19</span><span>&ldquo;Fancy his having the insolence to confound me with the official detective force! This incident gives zest to our investigation, however, and I only trust that our little friend will not suffer from her imprudence in allowing this brute to trace her. And now, Watson, we shall order breakfast, and afterwards I shall walk down to Doctors&rsquo; Commons, where I hope to get some data which may help us in this matter.&rdquo;</span></p><p class=\"ppara\"><span class=\"pnum\">20</span><span>It was nearly one o&rsquo;clock when Sherlock Holmes returned from his excursion. He held in his hand a sheet of blue paper, scrawled over with notes and figures.</span></p><p class=\"ppara\"><span class=\"pnum\">21</span><span>&ldquo;I have seen the will of the deceased wife,&rdquo; said he. &ldquo;To determine its exact meaning I have been obliged to work out the present prices of the investments with which it is concerned. The total income, which at the time of the wife&rsquo;s death was little short of 1100 pounds, is now, through the fall in agricultural prices, not more than 750 pounds. Each daughter can claim an income of 250 pounds, in case of marriage. It is evident, therefore, that if both girls had married, this beauty would have had a mere pittance, while even one of them would cripple him to a very serious extent. My morning&rsquo;s work has not been wasted, since it has proved that he has the very strongest motives for standing in the way of anything of the sort. And now, Watson, this is too serious for dawdling, especially as the old man is aware that we are interesting ourselves in his affairs; so if you are ready, we shall call a cab and drive to Waterloo. I should be very much obliged if you would slip your revolver into your pocket. An Eley&rsquo;s No. 2 is an excellent argument with gentlemen who can twist steel pokers into knots. That and a toothbrush are, I think, all that we need.&rdquo;</span></p>"}, "chainmail": {"label": "Chain Mail", "html": "<h3 class=\"ptitle\">Chain Mail</h3><p class=\"ppara\"><span class=\"pnum\">1</span><span>Flexible body armor made from interlocking iron or steel rings was known as far back as the ancient Roman era. Used primarily as protection for elite heavy cavalry troops, various forms of so-called &ldquo;chain mail&rdquo; armor were relatively rare and expensive at that time, and less practical in many ways than the Roman infantryman&rsquo;s segmented steel breastplate. For centuries after the fall of Imperial Rome, the craft of fashioning mail armor fell into disuse. In the medieval period, however, the techniques were revived and became more popular than ever. By the fourteenth century, entire armies were often outfitted with practical and effective linked-metal armor suits.</span></p><p class=\"ppara\"><span class=\"pnum\">2</span><span>The type of armor historians sometimes call &ldquo;chain mail,&rdquo; but which was called by the people of the time merely &ldquo;mail,&rdquo; had many advantages for the individual fighting man in the age of steel weapons. It combined the flexibility and suppleness of cloth with the impact-absorbing mass and cut resistance of rigid metal plates. Edged weapons, no matter how sharp, are incapable of slashing or sawing through a well-fashioned mail suit. Moreover, when struck with a blunt object, the links transfer much of the force through the mass of the garment, absorbing a significant amount of impact instead of allowing it to pass to the soft tissues of the wearer beneath.</span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>The process of manufacturing a mail shirt was very labor-intensive in preindustrial times. Each of the thousands of individual links that made up a full suit, or &ldquo;harness,&rdquo; had to be individually cut from a coil of hand-drawn wire. The ends of each link were flattened and drilled with tiny holes, and then the link was added into the garment and riveted closed. Each of these steps was accomplished by a small group of specialists in that task to reduce the amount of time needed to produce a suit. The master mailer was then able to grow or shrink the metal garment to &ldquo;knit&rdquo; sleeves, mittens, hoods, and other garments by varying the pattern of interlocking links. Modern mail-makers, or &ldquo;maillers,&rdquo; use these traditional techniques to create historically accurate chain mail and may work alone for a year to produce a full set of mail.</span></p><p class=\"ppara\"><span class=\"pnum\">4</span><span>At first, the expense of chain mail meant that it was used exclusively by the wealthy nobility. As soon as a soldier fell in battle, however, his coveted chain mail would quickly be taken for use by another. Eventually, as improved stabbing and piercing weapons became more widespread, linked mail armor became obsolete and was relegated to the common foot soldier, the peasant recruit, or just discarded completely. For the nobility, the need for greater protection spurred the development of armors revolving around cleverly articulated rigid steel plates instead. Because of this, only a few examples of medieval mail armor survive into the present.</span></p><p class=\"ppara\"><span class=\"pnum\">5</span><span>Today, in addition to traditional maillers, modern maillers produce chain mail with premade wire, electric motors, and pneumatic tools for costumes for Renaissance festivals, movies, theme parks, medieval restaurants, and fantasy hobbyists. Although these modern techniques make the process go faster, &ldquo;mail making&rdquo; remains a tedious, time-consuming pursuit.</span></p>"}, "asteroid": {"label": "Asteroid", "html": "<h3 class=\"ptitle\">Did an Asteroid Kill the Dinosaurs?</h3><p class=\"ppara\"><span class=\"pnum\">1</span><span>The question of why dinosaurs became extinct has puzzled paleontologists since the first dinosaur fossil was found almost two centuries ago. These great reptiles dominated the Earth for nearly 160 million years but mysteriously died out approximately 65 million years ago. Although various explanations for this disappearance have been offered, ranging from an epidemic to a sudden, catastrophic drop in temperature, no theory has yet been conclusively proven.</span></p><p class=\"ppara\"><span class=\"pnum\">2</span><span>One of the best-known theories was proposed in 1980 by Luis Alvarez, a Nobel Prize-winning physicist. According to Alvarez and his geologist son Walter, a huge meteor crashed into the Earth&rsquo;s surface 65 million years ago, sending up a massive cloud of dust and rock particles. The cloud blocked out sunlight for a period of months or even years, disrupting plant growth and the global food chain. The lack of plants as a food source, coupled with a significant drop in temperature, resulted in the extinction of the dinosaurs.</span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>Alvarez based his theory on an unusual piece of evidence. His research team discovered that a thin layer of the metal iridium had been deposited all over the world at approximately the time the dinosaurs died out. Since iridium is rarely found on the Earth&rsquo;s surface, Alvarez reasoned that it had either come up from the Earth&rsquo;s core by volcanic action or been deposited by meteorite strikes from space. Because iridium was deposited evenly in sediments worldwide, Alvarez found the meteorite theory more likely.</span></p><p class=\"ppara\"><span class=\"pnum\">4</span><span>But paleontologists&mdash;scientists who study fossils and ancient life&mdash;scoffed at the Alvarez extinction theory. Neither Luis nor Walter Alvarez was a paleontologist, yet they claimed to have solved a mystery that had defied the efforts of paleontologists for over a century. Some scientists pointed out that, in order to create the worldwide fallout of iridium on the scale suggested by Alvarez, the &ldquo;doomsday&rdquo; meteorite would have had to be about 5 miles in diameter, and its impact would have formed a crater perhaps a hundred miles wide. If such a meteorite had hit the Earth, where was the crater? Because of the absence of evidence of such a catastrophic collision, these critics were skeptical of the Alvarez theory.</span></p><p class=\"ppara\"><span class=\"pnum\">5</span><span>Finally, a decade after the cosmic extinction theory was first proposed, the crater was found. Lying partly underwater on the northern edge of Mexico&rsquo;s Yucatan Peninsula, the crater is 110 miles wide, with the center of impact close to the city of Chicxulub, which has given the crater its name. Long-buried under sediment, the Chicxulub crater had actually been discovered in 1981 by oil geologists, but dates of nearby rock samples taken at that time suggested that it was significantly older than 65 million years. New deepwater samples of melted rock from the crater itself were recently analyzed by an advanced dating process, however, and were found to be 64.98 million years old. Many scientists now feel that, thanks to the Alvarez theory, the mystery of dinosaur extinction has finally been solved.</span></p>"}, "birds": {"label": "Bird Courtship", "html": "<h3 class=\"ptitle\">Bird Courtship Behavior</h3><p class=\"ppara\"><span class=\"pnum\">1</span><span>Since there are thousands of species of birds in the natural world and many of these species tend to congregate in the same habitats, nearly every species has its own special courtship procedures and &ldquo;identification checks.&rdquo; Identification checks allow birds to ensure that they are mating with members of their own species. Identification checks are important because if members of different species mate, the offspring are often sterile or badly adapted to their surroundings. Once the species of a potential partner is confirmed, courtship rituals enable birds to assess the quality of their mates.</span></p><p class=\"ppara\"><span class=\"pnum\">2</span><span>For many bird species, plumage plays a key role in both identification and courtship. During breeding season, male birds acquire distinctive plumage that they use to attract females, and the females respond only to males with the correct markings. The most striking example of such plumage is the magnificently colored head, chest, and tail feathers of the male bird of paradise. When attempting to attract a mate, the male perches on a branch and then gradually leans forward until he is hanging upside down, covered with his own brilliant feathers. A female bird of paradise will watch the display and then respond. Scientists refer to the bird displaying the plumage as the &ldquo;actor,&rdquo; while the bird that observes is the &ldquo;reactor.&rdquo; Although the male is the actor and the female is the reactor in the case of birds of paradise, the females of some species are more brightly colored than the males, and the courtship roles are reversed.</span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>Distinctive behavioral changes can also be important aspects of courtship and breeding activity. Aggressiveness among males, and sometimes among females, is quite common. Some birds, such as whooping cranes and trumpeter swans, perform wonderfully elaborate courtship dances in which both sexes are enthusiastic participants. The purpose of the dance is to establish and maintain a &ldquo;pair bond&rdquo; that will last between the male and female through the period of the reproductive season, or at least until the nesting has been completed. Each species has its own set of inherited courtship behaviors, which also helps prevent mating between birds of different species.</span></p><p class=\"ppara\"><span class=\"pnum\">4</span><span>Bird calls are another key part of identification between individuals in a given species. When a female migrates to her breeding region in the spring, she often encounters numerous birds of different species. The males of her species identify themselves by their singing and communicate to her that they are in breeding condition. This information allows the female to predict the response of a male to her approach. Later, after mating has taken place, the note patterns of a particular male&rsquo;s song enable the nesting female to continue to identify her partner.</span></p><p class=\"ppara\"><span class=\"pnum\">5</span><span>Nature lovers do not need to travel to exotic lands to see these fascinating rituals take place. The northern cardinal, a common sight in the eastern and midwestern United States, is an excellent example of a territorial bird. Males perch on tall trees and sing high-pitched, piercing notes to announce that the surrounding area is their territory. They are so aggressive about defending it that they will sometimes mistake their reflection in a window or car as an invading male and attempt to fight it. During courtship, a male will feed a female, placing the food directly into her beak. Cardinals usually mate for life, and pairs will often sing to each other at dusk. Once the chicks have hatched, both parents help feed them, and the male listens carefully for their unique fledgling calls.</span></p><p class=\"ppara\"><span class=\"pnum\">6</span><span>The American goldfinch is another common bird with spectacular courtship behaviors. When a male is ready to mate, he will actually chase the prospective female. The female attempts to outmaneuver him by flying in zig-zag patterns, and the male signals his fitness and worthiness as a mate by matching her move for move. Once the two birds are pair-bonded, the male will establish his territory by flying from tree to tree, singing a unique warbling song as he goes. He will circle the perimeter twice: once in a low, flat flight and again in a &ldquo;daredevil&rdquo; display involving abrupt drops to the ground and loops. While the female sits on the eggs, the male brings her food, and both parents feed the chicks once they have hatched. These displays and rituals illustrate how complex behavior can emerge from the most primitive of biological needs&mdash;reproduction.</span></p><figure class=\"pfig\"><svg viewBox=\"0 0 421 442\" width=\"421\" height=\"442\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" fill=\"#1a2433\"><text x=\"210.5\" y=\"22\" text-anchor=\"middle\" font-size=\"15.5\" font-weight=\"700\">Avian Identification Behaviors</text><circle cx=\"210.5\" cy=\"174\" r=\"130\" fill=\"#d6e3f1\" fill-opacity=\".5\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><circle cx=\"137.754\" cy=\"300\" r=\"130\" fill=\"#dfe9f4\" fill-opacity=\".5\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><circle cx=\"283.246\" cy=\"300\" r=\"130\" fill=\"#cfdeee\" fill-opacity=\".5\" stroke=\"#1a2433\" stroke-width=\"1.6\"/><text x=\"210.5\" y=\"109.7\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" letter-spacing=\".04em\">PLUMAGE</text><text x=\"210.5\" y=\"124.9\" text-anchor=\"middle\" font-size=\"12.5\">Ex. Scarlet-tufted</text><text x=\"210.5\" y=\"140.4\" text-anchor=\"middle\" font-size=\"12.5\">malachite sunbird</text><text x=\"83.8\" y=\"315.7\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" letter-spacing=\".04em\">SONG</text><text x=\"83.8\" y=\"330.9\" text-anchor=\"middle\" font-size=\"12.5\">Ex. Purple-crowned</text><text x=\"83.8\" y=\"346.4\" text-anchor=\"middle\" font-size=\"12.5\">fairywren</text><text x=\"337.5\" y=\"323.7\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" letter-spacing=\".04em\">DANCE</text><text x=\"337.5\" y=\"338.9\" text-anchor=\"middle\" font-size=\"12.5\">Ex. Whooping crane</text><text x=\"135.5\" y=\"220.4\" text-anchor=\"middle\" font-size=\"12.5\">Ex. Peafowl</text><text x=\"285.0\" y=\"212.4\" text-anchor=\"middle\" font-size=\"12.5\">Ex. Bird of</text><text x=\"285.0\" y=\"227.9\" text-anchor=\"middle\" font-size=\"12.5\">paradise</text><text x=\"210.5\" y=\"338.4\" text-anchor=\"middle\" font-size=\"12.5\">Ex. Trumpeter</text><text x=\"210.5\" y=\"353.9\" text-anchor=\"middle\" font-size=\"12.5\">swan</text><text x=\"210.5\" y=\"262.4\" text-anchor=\"middle\" font-size=\"12.5\">Ex. Lyrebird</text></svg></figure>"}, "poem": {"label": "In Time", "html": "<h3 class=\"ptitle\">In Time</h3><div class=\"byline\">by Tara Hurley</div><div class=\"stanza\"><div class=\"pline\"><span class=\"lnum\"></span><span>Each morning, I am greeted by a familiar friend</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Poised outside my window, reaching out to greet me,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Its fingers gently brushing the window pane.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>A Hawthorn tree, strong yet graceful,</span></div><div class=\"pline\"><span class=\"lnum\">5</span><span>Stretches as high as my Brooklyn home.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Its wide embrace welcomes me each morning</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>As I open the curtains and gaze out at the day.</span></div><div class=\"stanzagap\"></div><div class=\"pline\"><span class=\"lnum\"></span><span>In spring, small birds flutter amongst its branches.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>They appear as specks of blue and black,</span></div><div class=\"pline\"><span class=\"lnum\">10</span><span>Peering through lush blooms of soft white petals.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Their song, delicate and sweet, cheers me,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>As they flit from branch to branch, giddy to be alive.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>The flowers gently fall to the ground, one by one;</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>They coat the sidewalk below, forming a carpet of white.</span></div><div class=\"stanzagap\"></div><div class=\"pline\"><span class=\"lnum\">15</span><span>In summer, the white blossoms give way to a shock of green,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>The bright blue sky peeking through the vibrant foliage.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>The fierce summer sun streams down from above;</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>It glints off each emerald leaf, each one so full of life.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>The relief of a gentle breeze whispers secrets through the leaves</span></div><div class=\"pline\"><span class=\"lnum\">20</span><span>And children, playing in the streets, follow the sound</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>And find shelter in the coolness of the shade.</span></div><div class=\"stanzagap\"></div><div class=\"pline\"><span class=\"lnum\"></span><span>In fall, the leaves transform as if catching fire</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Into shades of bright flame, gold and crimson.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Each day, the sight of it outside my window</span></div><div class=\"pline\"><span class=\"lnum\">25</span><span>Stirs a feeling of awe and wonder in my chest.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Leaves fall, one by one, like a slow and fiery rain,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Leaving empty branches behind, framed by indigo sky.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Squirrels race up and down the trunk, stashing away</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Treasures in preparation for the growing chill.</span></div><div class=\"stanzagap\"></div><div class=\"pline\"><span class=\"lnum\">30</span><span>In winter, the sight outside my window is haunting.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Bare branches stab the still, gray air, crossing and</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>Tangling with one another in a barren nest of twigs.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>No sign of life holds on&mdash;no petal, no leaf, no trace of color.</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>The birds have fled south; the squirrels are hidden away.</span></div><div class=\"pline\"><span class=\"lnum\">35</span><span>All is still, until one morning, when I peel back the curtains</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>And spot a fresh green bud emerging at the end of a branch,</span></div><div class=\"pline\"><span class=\"lnum\"></span><span>And I know it will begin all over again.</span></div></div>"}, "roosevelt": {"label": "Conservation", "html": "<h3 class=\"ptitle\">Excerpt from &ldquo;Conservation as a National Duty&rdquo;</h3><div class=\"byline\">by Theodore Roosevelt</div><p class=\"pintro\">In 1908, President Theodore Roosevelt addressed a gathering of state governors and other officials at the White House Conference on the Conservation of Natural Resources. The conference brought together leaders to discuss the nation&rsquo;s land, forests, waterways, and other natural resources. In this excerpt from his speech, Roosevelt reflects on the nation&rsquo;s development and considers its future.</p><p class=\"ppara\"><span class=\"pnum\">1</span><span>Disregarding for the moment the question of moral purpose, it is safe to say that the prosperity of our people depends directly on the energy and intelligence with which our natural resources are used. It is equally clear that these resources are the final basis of national power and perpetuity<sup>1</sup>. Finally, it is ominously evident that these resources are in the course of rapid exhaustion.</span></p><p class=\"ppara\"><span class=\"pnum\">2</span><span>This Nation began with the belief that its landed possessions were illimitable and capable of supporting all the people who might care to make our country their home; but already the limit of unsettled land is in sight, and indeed but little land fitted for agriculture now remains unoccupied save what can be reclaimed by irrigation and drainage&mdash;a subject with which this Conference is partly to deal. We began with an unapproached heritage of forests; more than half of the timber is gone. We began with coal fields more extensive than those of any other nation and with iron ores regarded as inexhaustible, and many experts now declare that the end of both iron and coal is in sight.</span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>The mere increase in our consumption of coal during 1907 over 1906 exceeded the total consumption in 1876, the Centennial year<sup>2</sup>. This is a striking fact: Thirty years went by, and the mere surplus of use of one year over the preceding year exceeded all that was used in 1876&mdash;and we thought we were pretty busy people even then. The enormous stores of mineral oil and gas are largely gone; and those Governors who have in their States cities built up by natural gas, where the natural gas has since been exhausted, can tell us something of what that means. Our natural waterways are not gone, but they have been so injured by neglect, and by the division of responsibility and utter lack of system in dealing with them, that there is less navigation on them now than there was fifty years ago. Finally, we began with soils of unexampled fertility, and we have so impoverished them by injudicious<sup>3</sup> use and by failing to check erosion that their crop-producing power is diminishing instead of increasing. In a word, we have thoughtlessly, and to a large degree unnecessarily, diminished the resources upon which not only our prosperity but the prosperity of our children and our children&rsquo;s children must always depend.</span></p><p class=\"ppara\"><span class=\"pnum\">4</span><span>We have become great in a material sense because of the lavish use of our resources, and we have just reason to be proud of our growth. But the time has come to inquire seriously what will happen when our forests are gone, when the coal, the iron, the oil, and the gas are exhausted, when the soils shall have been still further impoverished and washed into the streams, polluting the rivers, denuding<sup>4</sup> the fields, and obstructing navigation. These questions do not relate only to the next century or to the next generation. One distinguishing characteristic of really civilized men is foresight; we have to, as a nation, exercise foresight for this nation in the future; and if we do not exercise that foresight, dark will be the future! We should exercise foresight now, as the ordinarily prudent man exercises foresight in conserving and wisely using the property which contains the assurance of well-being for himself and his children. We want to see a man own his farm rather than rent it, because we want to see it an object to him to transfer it in better order to his children. We want to see him exercise forethought for the next generation. We need to exercise it in some fashion ourselves as a nation for the next generation.</span></p><p class=\"pnote\"><sup>1</sup>perpetuity: continued existence indefinitely</p><p class=\"pnote\"><sup>2</sup>Centennial year: 1876, the 100th anniversary of American independence</p><p class=\"pnote\"><sup>3</sup>injudicious: showing poor judgment; unwise</p><p class=\"pnote\"><sup>4</sup>denuding: stripping something of its covering</p>"}, "barber": {"label": "From Barber to Surgeon", "html": "<h3 class=\"ptitle\">From Barber to Surgeon</h3><p class=\"ppara\"><span class=\"pnum\">1</span><span>Barbers and surgeons have a lot of things in common. Although some members of the medical profession would like to ignore the connection, it is too true to be omitted from the pages of history. Being a barber is an old profession. In the distant past, the art of surgery and the trade of barber were combined. In all parts of the ancient civilized world, the barber acted as a kind of surgeon. He practiced phlebotomy, the art of blood-letting, and he dressed wounds.</span></p><p class=\"ppara\"><span class=\"pnum\">2</span><span>Until the twelfth century, religious people took care of men&rsquo;s bodies as well as their souls. Monks practiced surgery and medicine. Barbers learned a lot from the monks, whom they assisted in surgical operations. The practice of surgery involved the shedding of blood. Monks felt that this practice did not suit the functions of the clergy. After much discussion, in 1163, the clergy were forbidden to act as surgeons, but they were allowed to provide medicine. That same year, the Pope issued an important decree about religious pilgrimages.</span></p><p class=\"ppara\"><span class=\"pnum\">3</span><span>The new law satisfied the barbers, and they quickly took advantage of the opportunities now available to them. In London, the barbers advertised their blood-letting by putting blood in their windows to attract the attention of the public. This practice upset people, so a new law was passed eventually, telling the barbers in London to pour the blood somewhere else.</span></p><p class=\"ppara\"><span class=\"pnum\">4</span><span>Eventually, the barbers in London grouped together to form a guild. At first, its purpose was for social interaction only. Later, it became more like a trade union. As time progressed, the London Company of Barbers increased in importance. A change of title occurred in 1540, and the barbers were then called the Company of Barber-Surgeons. Although the surgeons and the barbers were separated by Act of Parliament in 1745, the barber-surgeons continued to practice for a long time.</span></p>"}}, "textOrder": ["speckled", "chainmail", "asteroid", "birds", "poem", "roosevelt", "barber"], "figs": {"prop_graph": "<div class=\"fig\"><svg viewBox=\"0 0 350 258\" width=\"350\" height=\"258\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Georgia,serif\" font-size=\"15\" fill=\"#1a2433\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"56\" y1=\"20\" x2=\"56\" y2=\"210\" stroke=\"#1a2433\" stroke-width=\"0.6\"/><text x=\"56\" y=\"227\" text-anchor=\"middle\" font-size=\"11\" >0</text><line x1=\"118.5\" y1=\"20\" x2=\"118.5\" y2=\"210\" stroke=\"#1a2433\" stroke-width=\"0.6\"/><text x=\"118.5\" y=\"227\" text-anchor=\"middle\" font-size=\"11\" >2</text><l var STORE = "shsat_combined_v1";

var queue = [], idx = 0, answers = {}, pending = null, elapsed = 0;
var elim = {};      // elim[key] = "AC" : choices the student crossed out
var paneReset = false;   // true for one render when the passage pane should go to top
var clickY = null;       // page scroll as it was BEFORE the browser focused a button

// A click focuses the button, and the browser scrolls that button into view before
// any click handler runs. Snapshot the real position on mousedown, which fires first.
document.addEventListener("mousedown", function(){
  clickY = window.pageYOffset || document.documentElement.scrollTop || 0;
}, true);
document.addEventListener("touchstart", function(){
  clickY = window.pageYOffset || document.documentElement.scrollTop || 0;
}, true);
var held = null;    // token picked up on a drag-table item
var plan = null;    // "full" or "one"
var startWith = null;
var mode = "start", ticker = null, viewText = null, secStart = 0;

var app = document.getElementById("app");
var bar = document.getElementById("bar");
var track = document.getElementById("track");

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function fmt(sec){
  var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h+":"+(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function key(it){ return it.sec + "-" + it.n; }
// A "set" is a run of consecutive items sharing a grp (one passage's
// questions).  Items without a grp are their own set -> forward-only.
function grpKey(it){ return it.sec + "/" + (it.grp ? it.grp : "@" + it.n); }
function setBounds(i){
  var g=grpKey(queue[i]), a=i, b=i;
  while (a>0 && grpKey(queue[a-1])===g) a--;
  while (b<queue.length-1 && grpKey(queue[b+1])===g) b++;
  return [a,b];
}
function setBlanks(a,b){
  var c=0;
  for (var i=a;i<=b;i++){
    var v = (i===idx ? pending : answers[key(queue[i])]);
    if (!v) c++;
  }
  return c;
}
function norm(v){
  return String(v == null ? "" : v).trim()
    .replace(/&minus;/g,"-").replace(/\u2212/g,"-").replace(/[$,%\s]/g,"");
}
function same(a, b){
  var x = norm(a), y = norm(b);
  if (!x) return false;
  if (x === y) return true;
  var fx = parseFloat(x), fy = parseFloat(y);
  return !isNaN(fx) && !isNaN(fy) && Math.abs(fx - fy) < 1e-9;
}

/* ------------------------------------------------------------ answer helpers */
function blankFor(it){
  if (it.type === "rowtable") return new Array(it.rows.length + 1).join("-");
  if (it.type === "dropdown") return new Array(it.parts.length + 1).join("-");
  if (it.type === "dragtable"){
    var a = []; for (var i = 0; i < it.correct.length; i++) a.push("");
    return a.join("|");
  }
  return "";
}
function parts(a, it){
  var s = (a == null || a === "") ? blankFor(it) : String(a);
  return it.type === "dragtable" ? s.split("|") : s.split("");
}
function letters(it){ return (it.n % 2 || it.sec === "math") ? "ABCDE" : "EFGHI"; }
function normExpr(v){
  return String(v == null ? "" : v)
    .replace(/≤/g,"<=").replace(/≥/g,">=")
    .replace(/−|–|—/g,"-")
    .replace(/×|·|∙/g,"*").replace(/÷/g,"/")
    .replace(/\s+/g,"").toLowerCase();
}
function checkAnswer(it, a){
  if (a == null || a === "") return false;
  var L = letters(it);
  switch (it.type){
    case "multi": {
      var want = it.ais.map(function(i){ return L.charAt(i); }).sort().join("");
      return String(a).split("").sort().join("") === want;
    }
    case "rowtable":  return String(a) === it.correct.join("");
    case "dropdown":  return String(a) === it.parts.map(function(p){return String(p[2]);}).join("");
    case "dragtable": return String(a) === it.correct.join("|");
    case "expr": {
      var got = normExpr(a);
      for (var i = 0; i < it.ans.length; i++){ if (normExpr(it.ans[i]) === got) return true; }
      return false;
    }
    case "num": {
      var x = parseFloat(norm(a)), y = parseFloat(norm(it.ans));
      if (isNaN(x) || isNaN(y)) return norm(a) === norm(it.ans);
      return Math.abs(x - y) <= (it.tol || 1e-9);
    }
    default: return String(a) === L.charAt(it.ai);
  }
}
function stripTags(s){
  return String(s).replace(/<[^>]+>/g,"").replace(/&minus;/g,"−")
                  .replace(/&nbsp;/g," ").replace(/&amp;/g,"&");
}
function keyText(it){
  var L = letters(it);
  switch (it.type){
    case "multi":     return it.ais.map(function(i){ return L.charAt(i); }).join(", ");
    case "rowtable":  return it.correct.map(function(c){ return it.cols[c]; }).join(" / ");
    case "dropdown":  return it.parts.map(function(p){ return stripTags(p[1][p[2]]); }).join(" / ");
    case "dragtable": return it.correct.join(", ");
    case "expr":      return it.ans[0];
    case "num":       return it.ans;
    default:          return L.charAt(it.ai);
  }
}
function youText(it, a){
  if (a == null || a === "" || a === blankFor(it)) return "";
  switch (it.type){
    case "rowtable":
      return parts(a,it).map(function(c){ return c==="-"?"—":it.cols[+c]; }).join(" / ");
    case "dropdown":
      return parts(a,it).map(function(c,i){
        return c==="-"?"—":stripTags(it.parts[i][1][+c]); }).join(" / ");
    case "dragtable":
      return parts(a,it).map(function(t){ return t===""?"—":t; }).join(", ");
    case "multi": return String(a).split("").sort().join(", ");
    default:      return String(a);
  }
}
function hasAnswer(it, a){
  if (a == null || a === "") return false;
  if (it.type === "rowtable" || it.type === "dropdown") return String(a).indexOf("-") === -1;
  if (it.type === "dragtable") return parts(a,it).every(function(t){ return t !== ""; });
  return !!norm(a);
}

function answered(){
  var c=0;
  queue.forEach(function(it){ if (hasAnswer(it, answers[key(it)])) c++; });
  return c;
}

function ask(head, msg, yesLabel, onYes){
  var m=document.getElementById("modal");
  document.getElementById("modal-h").textContent=head;
  document.getElementById("modal-p").textContent=msg;
  var yes=document.getElementById("modal-yes"), no=document.getElementById("modal-no");
  yes.textContent=yesLabel; m.hidden=false; yes.focus();
  function close(){ m.hidden=true; yes.onclick=null; no.onclick=null; }
  yes.onclick=function(){ close(); onYes(); };
  no.onclick=close;
}

function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(
    {idx:idx, answers:answers, elim:elim, hl:HL, elapsed:elapsed, mode:mode,
     secs:queue.length?uniqSecs():null})); }catch(e){}
}
function uniqSecs(){
  var out=[]; queue.forEach(function(i){ if(out.indexOf(i.sec)<0) out.push(i.sec); }); return out;
}
function wipe(){ try{ localStorage.removeItem(STORE); }catch(e){} }
function tick(){ elapsed++; if (elapsed % 15 === 0) save(); }
function startTicker(){ if(ticker) clearInterval(ticker); ticker=setInterval(tick,1000); }
function stopTicker(){ if(ticker){ clearInterval(ticker); ticker=null; } }

function secOf(k){
  for (var i=0;i<DATA.sections.length;i++) if (DATA.sections[i].key===k) return DATA.sections[i];
  return null;
}

/* ---------- text lock state ---------- */
function lastIdxOfText(tk){
  var last=-1;
  for (var i=0;i<queue.length;i++) if (queue[i].text===tk) last=i;
  return last;
}
function textState(tk){
  var li=lastIdxOfText(tk);
  if (li<0) return "none";
  if (idx>li) return "done";
  var cur=queue[idx];
  if (cur && cur.text===tk) return "current";
  return "future";
}

function paintChrome(){
  var showing = (mode==="test");
  bar.hidden=!showing; track.hidden=!showing;
  if(!showing) return;
  var it=queue[idx];
  document.getElementById("secname").textContent = "· " + secOf(it.sec).label;
  var secItems=queue.filter(function(q){return q.sec===it.sec;});
  var done=secItems.filter(function(q){return !!answers[key(q)];}).length;
  document.getElementById("count").textContent = done+" of "+secItems.length+" answered";
  document.getElementById("trackbar").style.width = ((idx/queue.length)*100)+"%";
}

function choiceRows(it){

function gridBox(){

    '<label for="gridbox">Your answer</label>'+

}


/* ------------------------------------------------------- item bodies by type */
function strikeBtn(L, on){
  return '<button class="elim" data-elim="'+L+'" type="button" tabindex="-1" '+
         'aria-label="'+(on?"Restore":"Cross out")+' choice '+L+'" '+
         'title="'+(on?"Restore this choice":"Cross this choice out")+'">'+
         (on?"&#8630;":"&times;")+'</button>';
}
function bodyMC(it){
  var L=letters(it), out="", struck=elim[key(it)]||"";
  for (var i=0;i<it.opts.length;i++){
    var c=L.charAt(i), off=struck.indexOf(c)>-1;
    out+='<div class="crow'+(pending===c?" on":"")+(off?" struck":"")+'">'+
      '<button class="pickwrap" data-letter="'+c+'" type="button">'+
      '<span class="ltr">'+c+'</span><span class="ct" data-hl="c:'+key(it)+':'+c+'">'+
      it.opts[i]+'</span></button>'+
      strikeBtn(c,off)+'</div>';
  }
  return '<div class="choices" role="group" aria-label="Answer choices">'+out+'</div>'+
    '<p class="elimhint">Use &times; to cross out a choice you have ruled out. Crossing out '+
    'never submits an answer.</p>'+
    '<p class="hlhint">Select any text above to highlight it. Click a highlight to remove '+
    'it.</p>';
}
function bodyMulti(it){
  var L=letters(it), chosen=pending?String(pending).split(""):[], out="";
  var struck=elim[key(it)]||"";
  for (var i=0;i<it.opts.length;i++){
    var c=L.charAt(i), on=chosen.indexOf(c)>-1, off=struck.indexOf(c)>-1;
    out+='<div class="crow'+(on?" on":"")+(off?" struck":"")+'">'+
      '<button class="pickwrap" data-check="'+c+'" type="button">'+
      '<span class="box">'+(on?"&#10003;":"")+'</span>'+
      '<span class="ltr">'+c+'</span><span class="ct" data-hl="c:'+key(it)+':'+c+'">'+
      it.opts[i]+'</span></button>'+
      strikeBtn(c,off)+'</div>';
  }
  var full=chosen.length===it.pick;
  return '<div class="choices" role="group" aria-label="Answer choices">'+out+'</div>'+
    '<p class="pickmsg'+(full?" full":"")+'">'+
    (full?"All "+it.pick+" selected.":chosen.length+" of "+it.pick+" selected.")+'</p>'+
    '<p class="elimhint">Use &times; to cross out a choice you have ruled out.</p>';
}
var PAL=["1","2","3","4","5","6","7","8","9","0","+","-","*","/","(",")",
         "<",">","≤","≥","=",".","x","π"];
function bodyExpr(it){
  var keys="";
  for (var i=0;i<PAL.length;i++) keys+='<button type="button" data-key="'+PAL[i]+'">'+PAL[i]+'</button>';
  keys+='<button type="button" class="util" data-key="BSP">&#9003;</button>'+
        '<button type="button" class="util" data-key="CLR">clear</button>';
  return '<div class="grid-in"><label for="exprbox">Your answer</label>'+
    '<input id="exprbox" class="exprbox" type="text" autocomplete="off" spellcheck="false" '+
    'value="'+(pending==null?"":String(pending).replace(/"/g,"&quot;"))+'">'+
    '<div class="pal">'+keys+'</div>'+
    '<div class="hint">Type your answer or use the buttons. Write a fraction with a '+
    'slash (3/4) and a product with * (0.2*3), and you may combine them in one '+
    'expression. Spaces do not matter.</div></div>';
}
function bodyRowTable(it){
  var sel=parts(pending,it), head='<th></th>';
  for (var c=0;c<it.cols.length;c++) head+='<th>'+it.cols[c]+'</th>';
  var rows="";
  for (var r=0;r<it.rows.length;r++){
    var cells='<td class="lab">'+it.rows[r]+'</td>';
    for (var c2=0;c2<it.cols.length;c2++){
      cells+='<td><button class="rdo'+(sel[r]===String(c2)?" on":"")+'" data-rt="'+r+","+c2+
             '" type="button" aria-label="'+it.cols[c2]+', row '+(r+1)+'"></button></td>';
    }
    rows+='<tr>'+cells+'</tr>';
  }
  return '<table class="rt"><tr>'+head+'</tr>'+rows+'</table>';
}
function bodyDropdown(it){
  var sel=parts(pending,it), out="";
  for (var i=0;i<it.parts.length;i++){
    var p=it.parts[i], opts='<option value="-">Choose&hellip;</option>';
    for (var j=0;j<p[1].length;j++){
      opts+='<option value="'+j+'"'+(sel[i]===String(j)?" selected":"")+'>'+
            stripTags(p[1][j])+'</option>';
    }
    out+='<div class="ddline">'+p[0]+'<select data-dd="'+i+'">'+opts+'</select>'+p[3]+'</div>';
  }
  return out;
}
function bodyDragTable(it){
  var placed=parts(pending,it), used={}, k=0;
  for (var i=0;i<placed.length;i++){ if (placed[i]) used[placed[i]]=true; }
  var tray="";
  for (var t=0;t<it.tokens.length;t++){
    var tk=it.tokens[t];
    tray+='<button class="tok'+(used[tk]?" used":"")+(held===tk?" held":"")+'" data-tok="'+
          tk+'" type="button"'+(used[tk]?" disabled":"")+'>'+tk+'</button>';
  }
  var head="";
  for (var c=0;c<it.head.length;c++) head+='<th>'+it.head[c]+'</th>';
  var rows="";
  for (var r=0;r<it.body.length;r++){
    var cells="";
    for (var c2=0;c2<it.body[r].length;c2++){
      var v=it.body[r][c2];
      if (v===null){
        cells+='<td><button class="dropcell'+(placed[k]?" filled":"")+
               (held&&!placed[k]?" target":"")+'" data-slot="'+k+'" type="button">'+
               (placed[k]||"")+'</button></td>';
        k++;
      } else cells+='<td>'+v+'</td>';
    }
    rows+='<tr>'+cells+'</tr>';
  }
  return '<div class="tray">'+tray+'</div>'+
    '<table class="rt"><tr>'+head+'</tr>'+rows+'</table>'+
    '<p class="elimhint">Tap an answer, then tap a box to place it. Tap a filled box to take '+
    'the answer back.</p>';
}
function itemBody(it){
  switch (it.type){
    case "multi":     return bodyMulti(it);
    case "num":       return gridBox();
    case "expr":      return bodyExpr(it);
    case "rowtable":  return bodyRowTable(it);
    case "dropdown":  return bodyDropdown(it);
    case "dragtable": return bodyDragTable(it);
    default:          return bodyMC(it);
  }
}
var BADGE={multi:"Select more than one", num:"Enter your answer",
           expr:"Write an expression", rowtable:"One per row",
           dropdown:"Drop-downs", dragtable:"Place the answers"};

function questionCard(it, isLast){
  var secItems=queue.filter(function(q){return q.sec===it.sec;});
  var pos=secItems.indexOf(it)+1;
  var bd=setBounds(idx), a=bd[0], b=bd[1];
  var inSet=(b>a), atSetEnd=(idx===b), canBack=(idx>a);

  var note;
  if (isLast)            note='Last question. The check mark submits your test.';
  else if (!inSet)       note='Once you move on, this question closes.';
  else if (atSetEnd)     note='Last question in this set. Submitting closes all '+
                              (b-a+1)+' and moves you on.';
  else                   note='You can move back and forth within this set until you '+
                              'submit the last question.';

  var fwdFinish = isLast || (inSet && atSetEnd);
  var fwdLabel  = isLast ? 'Finish test'
                         : (inSet && atSetEnd ? 'Submit this set' : 'Next question');

  return '<div class="eyebrow">'+
      '<span class="qnum">Question '+pos+' of '+secItems.length+'</span>'+
      (inSet ? '<span class="setpos">'+(idx-a+1)+' of '+(b-a+1)+' in this set</span>' : '')+
      (BADGE[it.type] ? '<span class="badge">'+BADGE[it.type]+'</span>' : '')+
    '</div>'+
    '<div class="stem" data-hl="s:'+key(it)+'">'+
      (it.lead ? '<p>'+it.lead+'</p>' : '')+
      (it.quote ? '<blockquote>'+it.quote+'</blockquote>' : '')+
      '<p>'+it.stem+'</p>'+
      (it.fig ? '<div class="qfig">'+DATA.figs[it.fig]+'</div>' : '')+
    '</div>'+
    itemBody(it)+
    '<div class="actions"><div class="note">'+note+'</div>'+
    '<div class="btns">'+
      (canBack ? '<button class="arrow back" id="prev" aria-label="Previous question" '+
                 'title="Previous question">&larr;</button>' : '')+
      '<button class="arrow'+(fwdFinish?" finish":"")+'" id="next" '+
      'aria-label="'+fwdLabel+'" title="'+fwdLabel+'">'+
      (isLast?"&#10003;":"&rarr;")+'</button>'+
    '</div></div>';
}

function passagePane(){
  var cur=queue[idx];
  var tabs="";
  DATA.textOrder.forEach(function(tk){
    var st=textState(tk);
    if (st==="none") return;
    var on = (viewText===tk);
    tabs+='<button class="ptab'+(on?" on":"")+(st==="done"?" done":"")+'" '+
          'data-tab="'+tk+'"'+(st==="done"?' aria-disabled="true"':'')+'>'+
          (st==="done"?'<span class="lk">&#128274;</span>':'')+
          DATA.texts[tk].label+'</button>';
  });
  var notice="";
  if (viewText && cur.text && viewText!==cur.text){
    notice='<div class="pnotice"><span>You are previewing another text. '+
      'The current question is about &ldquo;'+DATA.texts[cur.text].label+'&rdquo;.</span>'+
      '<button id="backcur">Back to current text</button></div>';
  }
  var html = viewText ? DATA.texts[viewText].html : '';
  return '<section class="pane passage"><div class="ptabs">'+tabs+'</div>'+
         '<div class="pbody" id="pbody">'+notice+
         '<div data-hl="t:'+viewText+'">'+html+'</div></div></section>';
}

function screenTest(){
  var it=queue[idx], isLast=(idx===queue.length-1);
  if (it.text){
    return '<div class="wrap wide"><div class="split">'+
      passagePane()+
      '<section class="pane qs">'+questionCard(it,isLast)+'</section>'+
    '</div></div>';
  }
  return '<div class="wrap"><div class="card">'+questionCard(it,isLast)+'</div></div>';
}

/* ---------- results ---------- */
function scored(){
  var out={total:{right:0,n:0}, secs:{}, rows:{}, missed:{}};
  queue.forEach(function(it){
    var s=it.sec;
    out.secs[s]=out.secs[s]||{right:0,n:0,blank:0};
    out.rows[s]=out.rows[s]||"";
    out.missed[s]=out.missed[s]||[];
    var a=answers[key(it)], ok=checkAnswer(it, a), has=hasAnswer(it, a);
    out.secs[s].n++; out.total.n++;
    if(!has) out.secs[s].blank++;
    if(ok){ out.secs[s].right++; out.total.right++; } else out.missed[s].push(it.n);
    var secItems=queue.filter(function(q){return q.sec===s;});
    var pos=secItems.indexOf(it)+1;
    out.rows[s]+='<tr><td class="q">'+pos+'</td>'+
      '<td class="'+(has?(ok?"right":"wrong"):"blank")+'">'+
        (has?youText(it,a):"&mdash;")+'</td>'+
      '<td>'+keyText(it)+
        ((it.type==="mc" && (elim[key(it)]||"").indexOf(letters(it).charAt(it.ai))>-1)
          ? ' <span class="wrong" title="You crossed out the correct answer">&times;</span>'
          : '')+'</td>'+
      '<td>'+(ok?'<span class="right">correct</span>'
                :'<span class="wrong">'+(has?"incorrect":"blank")+'</span>')+'</td></tr>';
  });
  return out;
}

function resultsText(){
  var s=scored();
  var name=(document.getElementById("student")||{}).value||"(no name)";
  var L=[];
  L.push("SHSAT Practice - English Language Arts and Mathematics");
  L.push("Student: "+name);
  L.push("Date: "+new Date().toLocaleDateString());
  L.push("Time: "+fmt(elapsed));
  L.push("");
  uniqSecs().forEach(function(k){
    var d=s.secs[k];
    L.push(secOf(k).label.toUpperCase()+": "+d.right+" / "+d.n+
           "  ("+Math.round(d.right/d.n*100)+"%)   blank: "+d.blank);
    L.push("  missed: "+(s.missed[k].length?s.missed[k].join(", "):"none"));
    L.push("");
  });
  if (uniqSecs().length>1)
    L.push("OVERALL: "+s.total.right+" / "+s.total.n+
           "  ("+Math.round(s.total.right/s.total.n*100)+"%)");
  L.push("");
  uniqSecs().forEach(function(k){
    L.push("--- "+secOf(k).label+" ---");
    L.push("Q    Yours   Key");
    var secItems=queue.filter(function(q){return q.sec===k;});
    secItems.forEach(function(it,i){
      var a=answers[key(it)]||"-";
      var pad=function(v,n){ v=String(v); while(v.length<n) v+=" "; return v; };
      L.push(pad(i+1,5)+pad(a,8)+pad(it.answer,6)+(same(a,it.answer)?"correct":"INCORRECT"));
    });
    L.push("");
  });
  return L.join("\n");
}

function copyResults(){
  var txt=resultsText();
  var done=function(){ var n=document.getElementById("mailnote");
    if(n) n.textContent="Results copied. Paste them wherever you keep them."; };
  function fallback(){
    try{
      var ta=document.createElement("textarea");
      ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); done();
    }catch(e){
      var n=document.getElementById("mailnote");
      if(n) n.textContent="Copying was blocked here. Download this file and open it in your "+
          "browser, then try again.";
    }
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(done, fallback);
    else fallback();
  }catch(e){ fallback(); }
}
function printSheet(){
  var name=(document.getElementById("student")||{}).value||"";
  var slot=document.getElementById("phname");
  if(slot) slot.textContent = name ? name : "—";
  try{ window.print(); }catch(e){}
}
