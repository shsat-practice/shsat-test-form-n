/* ---------- render ---------- */
function render(){
  // remember where the reader was before the DOM is thrown away
  var pageY = (clickY != null) ? clickY
            : (window.pageYOffset || document.documentElement.scrollTop || 0);
  clickY = null;
  var pane  = document.getElementById("pbody");
  var paneY = pane ? pane.scrollTop : 0;

  if (mode==="start")        app.innerHTML=screenStart();
  else if (mode==="secintro")app.innerHTML=screenSecIntro();
  else if (mode==="test")    app.innerHTML=screenTest();
  else                       app.innerHTML=screenResults();
  paintChrome(); wire(); hlPaintAll(); hlHideBar();

  if (mode!=="test"){ window.scrollTo(0,0); return; }
  // selecting or crossing out an answer re-renders in place: put the view back
  window.scrollTo(0, pageY);
  var pane2 = document.getElementById("pbody");
  if (pane2 && !paneReset) pane2.scrollTop = paneY;
  paneReset = false;
}

function wire(){
  var $=function(i){ return document.getElementById(i); };

  var pl=app.querySelectorAll("[data-plan]");
  for (var i=0;i<pl.length;i++){
    pl[i].onclick=function(){ plan=this.getAttribute("data-plan"); render(); };
  }
  var od=app.querySelectorAll("[data-order]");
  for (var o=0;o<od.length;o++){
    od[o].onclick=function(){ begin(this.getAttribute("data-order").split(",")); };
  }
  var bk=$("back");
  if (bk) bk.onclick=function(){ plan=null; render(); };
  var go=$("gosec");
  if (go) go.onclick=function(){ mode="test"; syncView(); render(); };

  var cs=app.querySelectorAll("[data-letter]");
  for (var j=0;j<cs.length;j++){
    cs[j].onclick=function(){ pending=this.getAttribute("data-letter"); render(); };
  }
  var ms=app.querySelectorAll("[data-check]");
  for (var m=0;m<ms.length;m++){
    ms[m].onclick=function(){
      var it=queue[idx], L=this.getAttribute("data-check");
      var cur=pending?String(pending).split(""):[], at=cur.indexOf(L);
      if (at>-1) cur.splice(at,1); else if (cur.length<it.pick) cur.push(L);
      pending=cur.sort().join(""); render();
    };
  }
  var xs=app.querySelectorAll("[data-elim]");
  for (var e=0;e<xs.length;e++){
    xs[e].onclick=function(ev){
      ev.stopPropagation();
      var it=queue[idx], L=this.getAttribute("data-elim"), k2=key(it);
      var cur=elim[k2]||"", at=cur.indexOf(L);
      elim[k2]= at>-1 ? cur.slice(0,at)+cur.slice(at+1) : cur+L;
      save(); render();
    };
  }
  var rts=app.querySelectorAll("[data-rt]");
  for (var r=0;r<rts.length;r++){
    rts[r].onclick=function(){
      var it=queue[idx], rc=this.getAttribute("data-rt").split(",");
      var cur=parts(pending,it); cur[+rc[0]]=rc[1];
      pending=cur.join(""); render();
    };
  }
  var dds=app.querySelectorAll("[data-dd]");
  for (var d=0;d<dds.length;d++){
    dds[d].onchange=function(){
      var it=queue[idx], cur=parts(pending,it);
      cur[+this.getAttribute("data-dd")]=this.value;
      pending=cur.join(""); save();
    };
  }
  var toks=app.querySelectorAll("[data-tok]");
  for (var t=0;t<toks.length;t++){
    toks[t].onclick=function(){
      var tk=this.getAttribute("data-tok");
      held=(held===tk)?null:tk; render();
    };
  }
  var slots=app.querySelectorAll("[data-slot]");
  for (var s2=0;s2<slots.length;s2++){
    slots[s2].onclick=function(){
      var it=queue[idx], i=+this.getAttribute("data-slot"), cur=parts(pending,it);
      if (cur[i]){ held=null; cur[i]=""; }
      else if (held){ cur[i]=held; held=null; }
      pending=cur.join("|"); render();
    };
  }
  var ex=$("exprbox");
  if (ex){
    ex.oninput=function(){ pending=this.value; };
    ex.onkeydown=function(ev){ if (ev.key==="Enter"){ ev.preventDefault(); advance(); } };
    var pk=app.querySelectorAll("[data-key]");
    for (var k3=0;k3<pk.length;k3++){
      pk[k3].onclick=function(){
        var v=this.getAttribute("data-key"), box=$("exprbox");
        if (v==="CLR") box.value="";
        else if (v==="BSP") box.value=box.value.slice(0,-1);
        else {
          var a=box.selectionStart, b=box.selectionEnd;
          box.value=box.value.slice(0,a)+v+box.value.slice(b);
          box.setSelectionRange(a+v.length,a+v.length);
        }
        pending=box.value; box.focus();
      };
    }
    ex.focus();
  }
  var gb=$("gridbox");
  if (gb){
    gb.oninput=function(){ pending=this.value; };
    gb.onkeydown=function(e){
      if (e.key==="Enter"){ e.preventDefault(); advance(); }
      if (e.key==="ArrowLeft" && !this.value){ e.preventDefault(); goBack(); }
    };
    gb.focus();
  }
  var nx=$("next"); if (nx) nx.onclick=advance;
  var pv=$("prev"); if (pv) pv.onclick=goBack;

  var tabs=app.querySelectorAll(".ptab[data-tab]");
  for (var t=0;t<tabs.length;t++){
    tabs[t].onclick=function(){
      var tk=this.getAttribute("data-tab");
      if (textState(tk)==="done"){
        ask("That text is closed",
            "You have already finished the questions for “"+DATA.texts[tk].label+
            "”, so it cannot be reopened.", "OK", function(){});
        return;
      }
      viewText=tk; paneReset=true; render();
    };
  }
  var bc=$("backcur");
  if (bc) bc.onclick=function(){ viewText=queue[idx].text; render(); };

  var pr=$("print"); if (pr) pr.onclick=printSheet;
  var cp=$("copy"); if (cp) cp.onclick=copyResults;
  var st=$("student");
  if (st) st.oninput=function(){
    var s=$("phname"); if(s) s.textContent=this.value?this.value:"—"; };
  var rs=$("restart");
  if (rs) rs.onclick=function(){
    ask("Start over?","This clears every answer and returns you to the start screen.",
        "Start over", function(){
      wipe(); queue=[]; idx=0; answers={}; elim={}; pending=null; held=null;
      elapsed=0; viewText=null; plan=null; mode="start"; stopTicker(); render();
    });
  };
}

function syncView(){
  var it=queue[idx];
  viewText = it && it.text ? it.text : null;
}

function begin(secKeys){
  wipe();
  queue=[]; answers={}; idx=0; elapsed=0; pending=null;
  secKeys.forEach(function(k){
    var s=secOf(k);
    if (s) s.items.forEach(function(it){ queue.push(it); });
  });
  elim={}; held=null;
  secStart=0; mode="secintro"; syncView(); startTicker(); render();
}

function step(to){
  var prevSec=queue[idx].sec;
  idx=to;
  pending = answers[key(queue[idx])] || null;
  var prevText = viewText;
  syncView();
  paneReset = (viewText !== prevText);
  save();
  if (queue[idx].sec!==prevSec) mode="secintro";
  render();
  if (mode==="test") window.scrollTo(0,0);
}

function goBack(){
  var bd=setBounds(idx);
  if (idx<=bd[0]) return;                       // never leave the current set
  if (pending) answers[key(queue[idx])]=pending;
  step(idx-1);
}

function advance(){
  var it=queue[idx];
  if (pending != null && pending !== "" && pending !== blankFor(it))
    answers[key(it)]=pending;
  held=null;
  var bd=setBounds(idx), a=bd[0], b=bd[1];

  if (idx===queue.length-1){
    ask("Finish the test?",
        "You will see your full score report. You cannot return to the questions.",
        "Finish test", finish);
    return;
  }
  // inside a set, with questions still ahead of us: just move on, nothing locks
  if (idx<b){ step(idx+1); return; }

  // at the end of a multi-question set: confirm, because this closes the set
  if (b>a){
    var blank=setBlanks(a,b), n=b-a+1;
    ask("Submit this set?",
        (blank
          ? "You have left "+blank+" of these "+n+" questions blank. "
          : "All "+n+" questions are answered. ")+
        "Submitting closes the set and its text. You cannot come back to it.",
        "Submit set", function(){ step(b+1); });
    return;
  }
  step(idx+1);
}

function finish(){ stopTicker(); mode="results"; save(); render(); }


/* ============================================================ highlighter */
var HL = {};              /* HL[region] = [[start,end], ...] over the region's text */
var hlBar = null;
var hlDrag = null;

function hlRegionOf(n){
  while (n){ if (n.nodeType===1 && n.getAttribute && n.getAttribute("data-hl")!=null) return n;
             n = n.parentNode; }
  return null;
}
function hlTextNodes(root){
  var out=[], w=document.createTreeWalker(root, 4, null, false), n;
  while ((n = w.nextNode())) out.push(n);
  return out;
}
function hlOffset(root, node, off){
  if (node.nodeType===1){                       /* selection landed on an element */
    var kids = hlTextNodes(node);
    if (!kids.length) return -1;
    node = off >= node.childNodes.length ? kids[kids.length-1] : kids[0];
    off  = off >= node.nodeValue.length ? node.nodeValue.length : 0;
  }
  var ns = hlTextNodes(root), t = 0;
  for (var i=0;i<ns.length;i++){
    if (ns[i] === node) return t + off;
    t += ns[i].nodeValue.length;
  }
  return -1;
}
function hlMerge(list){
  list.sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
  var out=[];
  for (var i=0;i<list.length;i++){
    var last = out[out.length-1];
    if (last && list[i][0] <= last[1]) last[1] = Math.max(last[1], list[i][1]);
    else out.push([list[i][0], list[i][1]]);
  }
  return out;
}
function hlPaint(root){
  var reg = root.getAttribute("data-hl"), rs = HL[reg];
  if (!rs || !rs.length) return;
  var ns = hlTextNodes(root), pos = 0;
  for (var i=0;i<ns.length;i++){
    var node = ns[i], txt = node.nodeValue, s = pos, e = pos + txt.length;
    pos = e;
    if (!txt.length || !node.parentNode) continue;
    var cuts = [];
    for (var j=0;j<rs.length;j++){
      var a = Math.max(rs[j][0], s), b = Math.min(rs[j][1], e);
      if (b > a) cuts.push([a-s, b-s, j]);
    }
    if (!cuts.length) continue;
    var frag = document.createDocumentFragment(), last = 0;
    for (var k=0;k<cuts.length;k++){
      if (cuts[k][0] > last) frag.appendChild(document.createTextNode(txt.slice(last, cuts[k][0])));
      var mk = document.createElement("mark");
      mk.className = "hl";
      mk.setAttribute("data-hlr", cuts[k][2]);
      mk.setAttribute("title", "Click to remove this highlight");
      mk.appendChild(document.createTextNode(txt.slice(cuts[k][0], cuts[k][1])));
      frag.appendChild(mk);
      last = cuts[k][1];
    }
    if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}
function hlPaintAll(){
  var rs = document.querySelectorAll("[data-hl]");
  for (var i=0;i<rs.length;i++) hlPaint(rs[i]);
}
function hlHideBar(){
  if (hlBar && hlBar.parentNode) hlBar.parentNode.removeChild(hlBar);
  hlBar = null;
}
function hlShowBar(rect, label, fn){
  hlHideBar();
  hlBar = document.createElement("div");
  hlBar.className = "hlbar";
  var b = document.createElement("button");
  b.type = "button";
  b.appendChild(document.createTextNode(label));
  b.onmousedown = function(ev){ ev.preventDefault(); };
  b.onclick = function(ev){ ev.preventDefault(); ev.stopPropagation(); fn(); hlHideBar(); };
  hlBar.appendChild(b);
  document.body.appendChild(hlBar);
  var sy = window.pageYOffset || document.documentElement.scrollTop || 0;
  var sx = window.pageXOffset || document.documentElement.scrollLeft || 0;
  var top = rect.top + sy - hlBar.offsetHeight - 8;
  if (top < sy + 4) top = rect.bottom + sy + 8;
  var left = rect.left + sx + rect.width/2 - hlBar.offsetWidth/2;
  var max = (document.documentElement.clientWidth || 900) - hlBar.offsetWidth - 6;
  hlBar.style.top  = Math.round(top) + "px";
  hlBar.style.left = Math.round(Math.max(6, Math.min(left, max))) + "px";
}
function hlFromSelection(sel){
  var rg = sel.getRangeAt(0);
  var root = hlRegionOf(rg.startContainer);
  if (!root || root !== hlRegionOf(rg.endContainer)){ hlHideBar(); return; }
  var s = hlOffset(root, rg.startContainer, rg.startOffset);
  var e = hlOffset(root, rg.endContainer, rg.endOffset);
  if (s < 0 || e < 0) { hlHideBar(); return; }
  var lo = Math.min(s,e), hi = Math.max(s,e);
  if (hi - lo < 2){ hlHideBar(); return; }
  var reg = root.getAttribute("data-hl");
  hlShowBar(rg.getBoundingClientRect(), "Highlight", function(){
    HL[reg] = hlMerge((HL[reg] || []).concat([[lo, hi]]));
    if (sel.removeAllRanges) sel.removeAllRanges();
    save(); render();
  });
}
function hlRemoveBar(m){
  var root = hlRegionOf(m);
  if (!root) { hlHideBar(); return; }
  var reg = root.getAttribute("data-hl"), j = parseInt(m.getAttribute("data-hlr"), 10);
  hlShowBar(m.getBoundingClientRect(), "Remove highlight", function(){
    if (HL[reg]) { HL[reg].splice(j, 1); if (!HL[reg].length) delete HL[reg]; }
    save(); render();
  });
}

/* mouseup and click both end the same gesture, and click always comes second, so the
   two share one debounced handler rather than fighting over the popup */
var hlMark = null, hlPend = null;
function hlGesture(){
  hlPend = null;
  var sel = window.getSelection();
  if (sel && !sel.isCollapsed && sel.rangeCount){ hlMark = null; hlFromSelection(sel); return; }
  if (hlMark){ var m = hlMark; hlMark = null; hlRemoveBar(m); return; }
  hlHideBar();
}
function hlSchedule(){
  if (hlPend) clearTimeout(hlPend);
  hlPend = setTimeout(hlGesture, 0);
}
function hlOnBar(t){ return t && t.parentNode && t.parentNode.className === "hlbar"; }

document.addEventListener("mouseup",  function(ev){ if (!hlOnBar(ev.target)) hlSchedule(); }, false);
document.addEventListener("touchend", function(ev){ if (!hlOnBar(ev.target)) hlSchedule(); }, false);

/* a click on a highlight offers to remove it, and never reaches the choice beneath */
document.addEventListener("click", function(ev){
  var m = ev.target;
  while (m && m.nodeType===1 && m.tagName !== "MARK"){
    if (m.getAttribute && m.getAttribute("data-hl") != null){ m = null; break; }
    m = m.parentNode;
  }
  if (!m || m.nodeType !== 1 || m.tagName !== "MARK") return;
  ev.preventDefault(); ev.stopPropagation();
  hlMark = m;
  hlSchedule();
}, true);

/* dragging across an answer choice selects text; it must not also pick that choice */
document.addEventListener("mousedown", function(e){ hlDrag = [e.clientX, e.clientY]; }, true);
document.addEventListener("click", function(e){
  if (!hlDrag) return;
  var dx = e.clientX - hlDrag[0], dy = e.clientY - hlDrag[1];
  hlDrag = null;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4){
    var sel = window.getSelection();
    if (sel && !sel.isCollapsed){ e.preventDefault(); e.stopPropagation(); }
  }
}, true);

render();
})();
</script>
